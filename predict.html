<div id="page-markets" class="page-container">
    <style>
        .glass-card { 
            background: rgba(18,22,40,0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 15px; 
            color: #ccd6f0; 
        }
        .title-main { color: #f0b90b; font-size: 18px; font-weight: bold; }
        .desc { color: #a3adc9; font-size: 14px; margin-bottom: 8px; }
        .highlight { color: #4ef0a8; font-weight: 700; }
        .highlight-green { color: #4ecca3; font-weight: 700; }
        .stat-row {
            display: flex; justify-content: space-between;
            font-size: 13px; color: #ccd6f0; margin: 4px 0;
        }
        .stat-value { color: #4ef0a8; font-weight: 700; }
        .btn {
            background: linear-gradient(135deg, #e94560, #b92b4a);
            border: none; color: white; font-weight: 700;
            padding: 14px 18px; border-radius: 18px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 8px 18px rgba(233,69,96,0.3);
            width: 100%; font-size: 15px; margin-top: 12px;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; box-shadow: none; transform: none; }
        .btn-green {
            background: linear-gradient(135deg, #4ecca3, #2e8b6a);
            box-shadow: 0 8px 18px rgba(78,204,163,0.3);
        }
        .btn-gold {
            background: linear-gradient(135deg, #f0b90b, #e8a000);
            box-shadow: 0 8px 18px rgba(240,185,11,0.3);
        }
        .info-box {
            background: #0a0d16; border-radius: 14px; padding: 12px;
            margin-top: 12px; font-size: 14px; border-left: 4px solid #e94560;
            word-break: break-word; color: #ccd6f0;
        }
        .reward-rule-text {
            font-size: 10px; color: #666; margin-top: 8px;
            text-align: center; line-height: 1.5;
        }
    </style>

    <!-- ========== 卡片1：每日升级奖励 ========== -->
    <div class="glass-card">
        <h2 style="font-size: 1.2rem; color: #f0b90b; margin-bottom: 12px;">
            📈 每日升级奖励
        </h2>
        <div class="desc">
            USDT升级用户享 <span class="highlight">1.6%/天</span> × <span class="highlight-green">90天</span>
        </div>
        <div class="stat-row">
            <span>升级本金：<span class="stat-value" id="bonusPrincipal">--</span></span>
            <span>每日可得：<span class="stat-value" id="bonusDaily">--</span></span>
        </div>
        <div class="stat-row" style="margin-top:8px;">
            <span>已领取：<span class="stat-value" id="bonusClaimed">--</span></span>
            <span>剩余：<span class="stat-value" id="bonusRemaining">--</span></span>
        </div>
        <button class="btn btn-gold" id="claimBonusBtn">📈 领取今日升级奖励</button>
        <div class="info-box" id="claimBonusResult" style="display:none;"></div>
    </div>

    <!-- ========== 卡片2：做市7天·天天领奖励 ========== -->
    <div class="glass-card">
        <h2 style="font-size: 1.2rem; color: #f0b90b; margin-bottom: 12px;">
            🏆 做市7天·天天都赚
        </h2>
        <div class="desc">
            持币就赚，<span class="highlight">币增长更赚</span>
        </div>
        <div class="stat-row">
            <span>连续已领：<span class="stat-value" id="streakDays">--</span> 天</span>
        </div>
        <div class="stat-row" style="margin-top:8px;">
            <span>最近购买：<span class="stat-value" id="holdingBalance">--</span>
                <span style="color:#888;font-size:10px;" id="holdingDaysAgo"></span>
            </span>
            <span>持币：<span class="stat-value" id="holdingAmount">--</span></span>
        </div>
        <div class="stat-row" style="margin-top:8px;">
            <span>今天可领：<span class="stat-value" id="todayReward">--</span></span>
            <span>已领币：<span class="stat-value" id="claimedToday">--</span></span>
        </div>
        <button class="btn btn-green" id="claimRewardBtn">领取奖励</button>
        <div class="reward-rule-text">
            每天0点结算 · 可累计领取 · 订单上限50U · 卖出重置 · 跳过可补领
        </div>
        <div class="info-box" id="claimRewardResult" style="display:none;"></div>
    </div>

    <script>
    var _pollCount = 0;
    function _waitForWeb3(callback) {
        if (typeof web3 !== 'undefined' && web3 && web3.eth) {
            callback();
        } else if (_pollCount < 60) {
            _pollCount++;
            setTimeout(function() { _waitForWeb3(callback); }, 500);
        }
    }

    _waitForWeb3(function() {
        var MYK = '0xc23CfEeC6D188D627C85106f682D9eb38d94192a';
        var RP = '0x8c2B172241C45250471524D1F6D08d516Ae562BC';
        var GOV = '0xE4B0187Aa2EaD11D102eE61Fe2a9AeE23C865e58';
        var USDT = '0x55d398326f99059fF775485246999027B3197955';
        var ROUTER = '0x10ED43C718714eb63d5aA57B78B54704E256024E';
        var PAIR = '0xCa4F4a81ed8a5f953f0Ea07d7Ee4e65969a33156';
        var SNAPSHOT_PERIOD = 300;

        var isProcessing = false;
        var cachedSpotPrice = 0;

        function $(id) { return document.getElementById(id); }
        function n(w) { return parseFloat(Web3.utils.fromWei(w + '', 'ether')); }
        function safeText(id, text) { var el = $(id); if (el) el.textContent = text; }
        function safeDisabled(id, val) { var el = $(id); if (el) el.disabled = val; }

        function encodeCall(sig, types, values) {
            var s = web3.eth.abi.encodeFunctionSignature(sig);
            if (!types || !types.length) return s;
            var e = web3.eth.abi.encodeParameters(types, values);
            return s + e.slice(2);
        }

        function parseError(e) {
            var m = (e && e.message) || '';
            var mc = m.match(/execution reverted:\s*(.+?)(?:"|$)/);
            if (mc) return mc[1].trim();
            var m2 = m.match(/reason="([^"]+)"/);
            if (m2) return m2[1];
            return m.slice(0, 200);
        }

        function lock() { if (isProcessing) { alert('请等待当前操作完成'); return false; } isProcessing = true; return true; }
        function unlock() { isProcessing = false; }

        async function waitForTransaction(txHash) {
            for (var i = 0; i < 30; i++) {
                try {
                    var r = await web3.eth.getTransactionReceipt(txHash);
                    if (r) { if (r.status) return r; else throw new Error('交易失败'); }
                } catch (e) { if (i === 29) throw e; }
                await new Promise(function(r) { setTimeout(r, 2000); });
            }
            throw new Error('超时');
        }

        function getCurrentDay() { return Math.floor(Date.now() / 1000 / SNAPSHOT_PERIOD); }
        function getAccount() { return window.currentAccount || null; }

        async function fetchSpotPrice() {
            if (!web3) return 0;
            try {
                try {
                    var result = await web3.eth.call({ to: RP, data: encodeCall('getCurrentPrice()') });
                    cachedSpotPrice = n(result);
                } catch (e1) {
                    try {
                        var ra = [{"constant":true,"inputs":[{"internalType":"uint256","name":"amountIn","type":"uint256"},{"internalType":"address[]","name":"path","type":"address[]"}],"name":"getAmountsOut","outputs":[{"internalType":"uint256[]","name":"amounts","type":"uint256[]"}],"type":"function"}];
                        var rc = new web3.eth.Contract(ra, ROUTER);
                        var amounts = await rc.methods.getAmountsOut(Web3.utils.toWei('1','ether'), [MYK, USDT]).call();
                        cachedSpotPrice = n(amounts[1]);
                    } catch (e2) {
                        try {
                            var pa = [{"constant":true,"inputs":[],"name":"getReserves","outputs":[{"internalType":"uint112","name":"_reserve0","type":"uint112"},{"internalType":"uint112","name":"_reserve1","type":"uint112"},{"internalType":"uint32","name":"_blockTimestampLast","type":"uint32"}],"type":"function"},{"constant":true,"inputs":[],"name":"token0","outputs":[{"internalType":"address","name":"","type":"address"}],"type":"function"}];
                            var pc = new web3.eth.Contract(pa, PAIR);
                            var t0 = await pc.methods.token0().call();
                            var rv = await pc.methods.getReserves().call();
                            var r0 = BigInt(rv[0]), r1 = BigInt(rv[1]);
                            if (r0 === BigInt(0) || r1 === BigInt(0)) throw new Error('0');
                            var rU, rM;
                            if (t0.toLowerCase() === USDT.toLowerCase()) { rU = r0; rM = r1; } else { rU = r1; rM = r0; }
                            cachedSpotPrice = parseFloat(Web3.utils.fromWei(((rU * BigInt(10 ** 18)) / rM).toString(), 'ether'));
                        } catch (e3) {}
                    }
                }
            } catch (e) {}
            return cachedSpotPrice;
        }

        function getSpotPrice() { return cachedSpotPrice; }

        // ===== 每日升级奖励 =====
        async function fetchDailyBonusInfo() {
            var userAddress = getAccount();
            if (!userAddress) {
                safeText('bonusPrincipal', '--'); safeText('bonusDaily', '--');
                safeText('bonusClaimed', '--'); safeText('bonusRemaining', '--');
                safeDisabled('claimBonusBtn', true); safeText('claimBonusBtn', '📈 暂无升级奖励');
                return;
            }
            try {
                var data = encodeCall('getDailyBonusInfo(address)', ['address'], [userAddress]);
                var result = await web3.eth.call({ to: RP, data: data });
                var info = web3.eth.abi.decodeParameters(
                    ['uint256','uint256','uint256','uint256','uint256','bool','uint256'], result
                );
                var principal = n(info[0]);
                var dailyAmountUSDT = n(info[1]);
                var totalClaimedUSDT = n(info[4]);
                var isActive = info[5];
                var claimableUSDT = n(info[6]);
                var sp = getSpotPrice();
                var dailyAmountMYK = sp > 0 ? (dailyAmountUSDT / sp) : 0;
                var totalClaimedMYK = sp > 0 ? (totalClaimedUSDT / sp) : 0;
                var claimableMYK = sp > 0 ? (claimableUSDT / sp) : 0;
                var claimedDays = dailyAmountUSDT > 0 ? Math.floor(totalClaimedUSDT / dailyAmountUSDT) : 0;
                var remainingDays = Math.max(0, 90 - claimedDays);

                safeText('bonusPrincipal', principal.toFixed(2) + ' USDT');
                safeText('bonusDaily', dailyAmountMYK.toFixed(6) + ' MYK');
                safeText('bonusClaimed', claimedDays + '天 / ' + totalClaimedMYK.toFixed(6) + ' MYK');
                safeText('bonusRemaining', remainingDays + '天');

                if (!isActive || remainingDays <= 0) {
                    safeDisabled('claimBonusBtn', true);
                    safeText('claimBonusBtn', !isActive ? '📈 暂无升级奖励' : '✅ 已全部领取');
                } else {
                    safeDisabled('claimBonusBtn', false);
                    safeText('claimBonusBtn', '📈 领取今日升级奖励 (' + claimableMYK.toFixed(6) + ' MYK)');
                }
            } catch (e) {
                safeText('bonusPrincipal', '--'); safeText('bonusDaily', '--');
                safeText('bonusClaimed', '--'); safeText('bonusRemaining', '--');
                safeDisabled('claimBonusBtn', true); safeText('claimBonusBtn', '📈 暂无升级奖励');
            }
        }

        async function claimDailyBonus() {
            var userAddress = getAccount();
            if (!userAddress) { alert('请先连接钱包'); return; }
            if (!lock()) return;
            var b = $('claimBonusBtn'), el = $('claimBonusResult');
            if (!b || !el) return;
            el.style.display = 'block'; el.innerHTML = '⏳ 领取中...'; b.disabled = true;
            try {
                var tx = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: userAddress, to: RP, data: encodeCall('claimDailyBonus()') }] });
                el.innerHTML = '⏳ 等待确认...'; await waitForTransaction(tx);
                el.innerHTML = '✅ 领取成功！'; el.style.borderLeftColor = '#4ecca3'; el.style.background = 'rgba(78,204,163,0.1)';
                setTimeout(function() { fetchAllData(); }, 3000);
            } catch (e) {
                var m = parseError(e);
                el.innerHTML = (m.indexOf('NothingToClaim') !== -1 || m.indexOf('already claimed') !== -1) ? '⚠️ 今日已领取' : m.indexOf('not active') !== -1 ? '⚠️ 暂无升级奖励' : '❌ ' + m;
            } finally { b.disabled = false; unlock(); }
        }

        // ===== 【修复】做市7天持币奖励 - 通过PancakeSwap交易记录查询最近购买 =====
        async function fetchHoldingInfo() {
            var userAddress = getAccount();
            if (!userAddress) {
                safeText('streakDays', '--'); safeText('holdingBalance', '--');
                safeText('holdingAmount', '--'); safeText('holdingDaysAgo', '');
                safeText('claimedToday', '--'); safeText('todayReward', '--');
                safeDisabled('claimRewardBtn', true); safeText('claimRewardBtn', '请先连接钱包');
                return;
            }
            try {
                var isActive = false;
                var buyTimestamp = 0, buyAmount = 0, buyValue = 0;
                var streakDays = 0, totalClaimed = 0, claimable = 0;

                // 1. 检查激活状态
                try {
                    var basicResult = await web3.eth.call({ to: RP, data: encodeCall('getUserBasic(address)', ['address'], [userAddress]) });
                    var u = web3.eth.abi.decodeParameters(['address','uint256','uint256','uint8','uint256','bool','uint256','uint256'], basicResult);
                    isActive = u[5];
                } catch (e) {
                    try {
                        var iaResult = await web3.eth.call({ to: RP, data: encodeCall('isActiveUser(address)', ['address'], [userAddress]) });
                        isActive = web3.eth.abi.decodeParameter('bool', iaResult);
                    } catch (e2) {}
                }

                // 2. 【核心修复】通过 Pair 合约查询 Transfer 事件获取最近一笔买入
                try {
                    // 查询从 Pair 到用户的 MYK Transfer 事件（即用户买入 MYK）
                    var currentBlock = await web3.eth.getBlockNumber();
                    var fromBlock = Math.max(0, currentBlock - 50000); // 约7天的区块

                    // 获取 Transfer 事件签名
                    var transferEventSig = web3.eth.abi.encodeEventSignature('Transfer(address,address,uint256)');

                    // 查询 Pair → 用户的 MYK 转入记录
                    var logs = await web3.eth.getPastLogs({
                        fromBlock: fromBlock,
                        toBlock: 'latest',
                        address: PAIR,
                        topics: [transferEventSig, null, web3.eth.abi.encodeParameter('address', userAddress)]
                    });

                    if (logs && logs.length > 0) {
                        // 取最新一条记录
                        var latestLog = logs[logs.length - 1];
                        var block = await web3.eth.getBlock(latestLog.blockNumber);
                        buyTimestamp = parseInt(block.timestamp);
                        buyAmount = n(latestLog.data);
                        buyValue = 0; // 需要从 Swap 事件获取 USDT 金额
                    }

                    // 如果没有 Transfer 事件，尝试 getLastPancakeBuyTime
                    if (buyTimestamp === 0) {
                        try {
                            var timeResult = await web3.eth.call({ to: RP, data: encodeCall('getLastPancakeBuyTime(address)', ['address'], [userAddress]) });
                            buyTimestamp = parseInt(web3.eth.abi.decodeParameter('uint256', timeResult));
                        } catch (e) {
                            try {
                                var infoResult = await web3.eth.call({ to: RP, data: encodeCall('getLastPancakeBuyInfo(address)', ['address'], [userAddress]) });
                                var bi = web3.eth.abi.decodeParameters(['uint256','uint256','uint256'], infoResult);
                                buyAmount = n(bi[0]);
                                buyValue = n(bi[1]);
                                buyTimestamp = parseInt(bi[2]);
                            } catch (e2) {}
                        }
                    }
                } catch (e) {
                    // 降级方案全部失败
                }

                // 3. MYK余额
                try {
                    var mykResult = await web3.eth.call({ to: MYK, data: encodeCall('balanceOf(address)', ['address'], [userAddress]) });
                    buyAmount = n(web3.eth.abi.decodeParameter('uint256', mykResult));
                    safeText('holdingAmount', buyAmount.toFixed(2) + ' MYK');
                } catch (e) { safeText('holdingAmount', '--'); }

                // 4. getStreakLength
                try {
                    var streakResult = await web3.eth.call({ to: RP, data: encodeCall('getStreakLength(address)', ['address'], [userAddress]) });
                    streakDays = parseInt(web3.eth.abi.decodeParameter('uint256', streakResult));
                    safeText('streakDays', streakDays);
                } catch (e) { safeText('streakDays', '0'); }

                // 5. getTotalDailyRewardClaimed
                try {
                    var claimedResult = await web3.eth.call({ to: RP, data: encodeCall('getTotalDailyRewardClaimed(address)', ['address'], [userAddress]) });
                    totalClaimed = n(web3.eth.abi.decodeParameter('uint256', claimedResult));
                    safeText('claimedToday', totalClaimed.toFixed(4) + ' MYK');
                } catch (e) { safeText('claimedToday', '0.0000 MYK'); }

                // 6. getClaimableDailyReward
                try {
                    var claimableResult = await web3.eth.call({ to: RP, data: encodeCall('getClaimableDailyReward(address)', ['address'], [userAddress]) });
                    claimable = n(web3.eth.abi.decodeParameter('uint256', claimableResult));
                } catch (e) {}

                // 7. 显示购买记录
                if (buyTimestamp > 0) {
                    var diffSec = Math.floor(Date.now() / 1000) - buyTimestamp;
                    var diffDays = Math.floor(diffSec / 86400);
                    if (diffDays <= 0) {
                        var diffHours = Math.floor(diffSec / 3600);
                        safeText('holdingDaysAgo', diffHours <= 0 ? (Math.floor(diffSec / 60) <= 1 ? '(刚刚)' : '(' + Math.floor(diffSec / 60) + '分钟前)') : '(' + diffHours + '小时前)');
                    } else {
                        safeText('holdingDaysAgo', '(' + diffDays + '天前)');
                    }
                    if (buyValue > 0) {
                        safeText('holdingBalance', buyValue.toFixed(2) + ' USDT');
                    } else if (diffDays <= 7) {
                        safeText('holdingBalance', '✅ 7天内有买入');
                    } else {
                        safeText('holdingBalance', '⚠️ 超过7天 (' + new Date(buyTimestamp * 1000).toLocaleDateString('zh-CN') + ')');
                    }
                } else {
                    safeText('holdingDaysAgo', '');
                    safeText('holdingBalance', '无买入记录');
                }

                // 8. 判断今天可领
                var errorMsg = '', btnDisabled = false;
                if (!isActive) {
                    errorMsg = '请先激活 PRIMARY 身份'; btnDisabled = true;
                    safeText('todayReward', '未激活');
                } else if (buyTimestamp <= 0) {
                    errorMsg = '没有买入记录'; btnDisabled = true;
                    safeText('todayReward', '无买入记录');
                } else if (buyTimestamp > 0 && (Math.floor(Date.now() / 1000) - buyTimestamp) > 7 * 86400) {
                    errorMsg = '最近买入已超过7天'; btnDisabled = true;
                    safeText('todayReward', '超过7天');
                } else {
                    var buyDay = Math.floor(buyTimestamp / SNAPSHOT_PERIOD);
                    if (buyDay >= getCurrentDay()) {
                        errorMsg = '买入当天不可领取，0点后结算'; btnDisabled = true;
                        safeText('todayReward', '等待结算');
                    } else if (claimable <= 0) {
                        errorMsg = '今日已领取，0点后结算'; btnDisabled = true;
                        safeText('todayReward', '已领取');
                    } else {
                        safeText('todayReward', claimable.toFixed(6) + ' MYK');
                    }
                }
                safeDisabled('claimRewardBtn', btnDisabled);
                safeText('claimRewardBtn', btnDisabled ? errorMsg : '领取奖励');
            } catch (e) {
                safeText('holdingBalance', '--'); safeText('holdingAmount', '--');
                safeText('streakDays', '--'); safeText('claimedToday', '--');
                safeText('todayReward', '--'); safeDisabled('claimRewardBtn', true);
                safeText('claimRewardBtn', '数据加载失败');
            }
        }

        async function claimDailyReward() {
            var userAddress = getAccount();
            if (!userAddress) { alert('请先连接钱包'); return; }
            if (!lock()) return;
            var b = $('claimRewardBtn'), el = $('claimRewardResult');
            if (!b || !el) return;
            el.style.display = 'block'; el.innerHTML = '⏳ 领取中...'; b.disabled = true; b.textContent = '处理中...';
            try {
                var txHash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: userAddress, to: RP, data: encodeCall('claimDailyRewardAuto()'), gas: '0xF4240' }] });
                el.innerHTML = '⏳ 等待确认...'; await waitForTransaction(txHash);
                el.innerHTML = '✅ 领取成功！'; el.style.borderLeftColor = '#4ecca3'; el.style.background = 'rgba(78,204,163,0.1)';
                b.textContent = '已领取（明天再来）'; b.disabled = true;
                setTimeout(function() { fetchAllData(); }, 3000);
            } catch (e) {
                var m = parseError(e);
                el.innerHTML = (m.indexOf('NotActive') !== -1) ? '⚠️ 账户未激活' : (m.indexOf('NoRecent') !== -1) ? '⚠️ 7天内无买入' : (m.indexOf('TooFrequent') !== -1) ? '⚠️ 今天已领取' : (m.indexOf('rejected') !== -1) ? '⚠️ 已取消' : '❌ ' + m;
            } finally { b.disabled = false; if (b.textContent.indexOf('已领取') === -1) b.textContent = '领取奖励'; unlock(); }
        }

        async function fetchAllData() {
            await fetchSpotPrice();
            await fetchDailyBonusInfo();
            await fetchHoldingInfo();
        }

        function doInit() {
            var cbb = $('claimBonusBtn'); if (cbb) cbb.addEventListener('click', claimDailyBonus);
            var crb = $('claimRewardBtn'); if (crb) crb.addEventListener('click', claimDailyReward);
            fetchAllData();
            setInterval(function() { fetchAllData(); }, 30000);
            document.addEventListener('walletConnected', function() { fetchAllData(); });
        }

        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', function() { setTimeout(doInit, 200); }); }
        else { setTimeout(doInit, 200); }
    });
    </script>
</div>
