<div id="page-rewards" class="page-content">
    <style>
        .reward-card {
            background: rgba(15, 20, 34, 0.6);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .progress-bar-container {
            width: 100%;
            height: 16px;
            background: #1a1f35;
            border-radius: 8px;
            margin: 6px 0;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecca3, #f0b90b);
            border-radius: 8px;
            transition: width 0.3s;
        }
    </style>

    <div class="glass-card">
        <h2 style="color:#f0b90b;margin-bottom:8px;">🏆 做市7天·天天都赚</h2>
        <div class="stat-row"><span>连续已领：</span><span class="stat-value" id="streakDays">--</span></div>
        <div class="stat-row"><span>最近购买：</span><span class="stat-value" id="holdingBalance">--</span></div>
        <div class="stat-row"><span>今天可领：</span><span class="stat-value" id="todayReward">--</span></div>
        <button class="btn btn-green" id="claimRewardBtn" disabled>请先连接钱包</button>
        <div class="info-box" id="claimRewardResult"></div>
    </div>

    <div class="glass-card">
        <h2 style="color:#f0b90b;margin-bottom:8px;">🎁 百万MYK生态福利</h2>
        <div class="stat-row"><span>已赠送：</span><span class="stat-value" id="airdropPaid">--</span></div>
        <div class="stat-row"><span>剩余：</span><span class="stat-value" id="airdropRemaining">--</span></div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="airdropProgress" style="width:0%;"></div>
        </div>
    </div>

    <div class="glass-card">
        <h2 style="color:#f0b90b;margin-bottom:8px;">📈 每日升级奖励</h2>
        <div class="stat-row"><span>升级本金：</span><span class="stat-value" id="bonusPrincipal">--</span></div>
        <div class="stat-row"><span>每日可得：</span><span class="stat-value" id="bonusDaily">--</span></div>
        <div class="stat-row"><span>已领取：</span><span class="stat-value" id="bonusClaimed">--</span></div>
        <div class="stat-row"><span>剩余：</span><span class="stat-value" id="bonusRemaining">--</span></div>
        <button class="btn btn-gold" id="claimBonusBtn" disabled>📈 暂无升级奖励</button>
        <div class="info-box" id="claimBonusResult"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('claimRewardBtn').addEventListener('click', () => {
                if (!window.isConnected) { showToast('请先连接钱包', 'error'); return; }
                showToast('领取功能开发中...', 'info');
            });
            document.getElementById('claimBonusBtn').addEventListener('click', () => {
                if (!window.isConnected) { showToast('请先连接钱包', 'error'); return; }
                showToast('领取功能开发中...', 'info');
            });
        });
    </script>
</div>
