<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X.Claw DApp</title>
    <!-- 公共样式 -->
    <link rel="stylesheet" href="css/style.css">
    <!-- 页面专用样式（内联在 index.html 中或者单独引入） -->
    <style>
        /* ===== 首页专用样式 ===== */
        .card-dark {
            background: rgba(21, 22, 36, 0.9);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #23243a;
            color: #fff;
        }

        .title-section {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .title-left h2 {
            font-size: 18px;
        }

        .title-left span {
            font-size: 12px;
            color: #888;
        }

        .progress-ring {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-text {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
        }

        .status-badge {
            background-color: #3e1d24;
            color: #ff6b6b;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            border: 1px solid #5e2a30;
            margin: 5px 0 15px 0;
        }

        .spinner-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid #ff4d4d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
            background-color: rgba(255, 59, 59, 0.2);
            box-shadow: 0 0 6px rgba(255, 59, 59, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-item {
            background-color: #0f101e;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            border: 1px solid #1f2135;
        }

        .stat-num {
            font-size: 16px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
        }

        .price-row {
            background-color: #0f101e;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            align-items: center;
            border: 1px solid #1f2135;
        }

        .input-wrapper {
            margin-top: 10px;
        }

        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .input-box {
            background-color: #0a0a14;
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #25263a;
        }

        .input-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 18px;
            width: 60%;
        }

        .input-box input:focus {
            outline: none;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .max-btn {
            color: #ff3b3b;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .token-tag {
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .token-icon {
            width: 16px;
            height: 16px;
            background: #ffd700;
            border-radius: 50%;
            margin-right: 5px;
        }

        .arrow-separator {
            text-align: center;
            color: #ff3b3b;
            margin: 5px 0;
            font-size: 20px;
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(90deg, #ff3b3b, #ff5252);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 59, 59, 0.3);
            transition: opacity 0.3s;
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .rules {
            font-size: 12px;
            color: #999;
            margin-top: 15px;
        }

        .rules li {
            margin-bottom: 4px;
            list-style: none;
        }

        .rules li::before {
            content: "● ";
            color: #666;
        }

        /* ===== OpenClaw 专用样式 ===== */
        .banner-container {
            width: 100%;
            margin-bottom: 15px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(135deg, #ff8c00, #ff6600);
            position: relative;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
        }

        .banner-title {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 10px;
        }

        .banner-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 10px;
            position: relative;
            max-width: 280px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .banner-card h2 {
            color: #1a3c6e;
            font-size: 20px;
            margin-bottom: 4px;
        }

        .banner-card h3 {
            color: #ff3b3b;
            font-size: 18px;
            font-weight: bold;
        }

        .banner-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f7d875, #d4a017);
            margin: 10px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 24px;
        }

        .card-beige {
            background: #fcf8e8;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-beige h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #222;
        }

        .card-beige .sub-text {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .progress-area {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .circle-progress {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 6px solid #ff8c00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #ff8c00;
            margin-right: 20px;
            flex-shrink: 0;
            position: relative;
        }
        .circle-progress::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 6px solid #e0e0e0;
            border-top-color: #ff8c00;
            transform: rotate(-45deg);
        }

        .progress-info {
            flex: 1;
        }
        .progress-info .row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .progress-info .row span:last-child {
            font-weight: bold;
        }
        .progress-info .highlight {
            color: #4a90d9;
        }
        .progress-info .highlight-red {
            color: #ff3b3b;
        }

        .countdown-area {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }
        .countdown-area .label {
            font-size: 14px;
            color: #555;
            margin-right: 15px;
        }
        .countdown-box {
            display: flex;
            gap: 8px;
        }
        .countdown-box .box {
            background: #1a1a1a;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            min-width: 32px;
            text-align: center;
        }
        .countdown-box .colon {
            color: #1a1a1a;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .participate-btn {
            width: 100%;
            background: #b0b0b0;
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            text-align: center;
        }

        .record-table {
            width: 100%;
        }
        .record-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 12px;
        }
        .record-row:last-child {
            border-bottom: none;
        }
        .record-row .col-left {
            display: flex;
            flex-direction: column;
            color: #28a745;
            font-weight: 500;
        }
        .record-row .col-left .time {
            color: #999;
            font-weight: normal;
            font-size: 11px;
            margin-top: 2px;
        }
        .record-row .col-mid {
            display: flex;
            flex-direction: column;
            text-align: right;
            color: #333;
        }
        .record-row .col-mid .usd {
            color: #999;
            font-size: 11px;
        }
        .record-row .col-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            color: #666;
            font-size: 11px;
        }
        .record-row .col-right .icons {
            display: flex;
            gap: 4px;
            margin-top: 2px;
        }
        .record-row .col-right .icons span {
            background: #eee;
            border-radius: 4px;
            padding: 0 4px;
            font-size: 10px;
            cursor: pointer;
        }

        .rules-list {
            font-size: 13px;
            color: #444;
            line-height: 1.8;
        }
        .rules-list li {
            list-style: none;
            margin-bottom: 2px;
        }
        .rules-list li::before {
            content: "• ";
            color: #ff8c00;
        }
    </style>
</head>
<body>

    <!-- ===== 通知提示 ===== -->
    <div id="toast" class="toast"></div>

    <div class="mobile-container">
        <!-- ===== 顶部导航 ===== -->
        <header>
            <div class="logo-area">
                <div class="logo-icon"></div>
                X.CLAW
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="walletConnectBtn" class="wallet-btn" onclick="toggleWallet()">
                    <span id="walletDot" class="wallet-dot"></span>
                    <span id="walletStatus">连接钱包</span>
                </button>
                <div style="font-size: 20px; cursor: pointer;">🌐</div>
            </div>
        </header>

        <!-- ===== 页面容器 ===== -->
        <div id="page-container">
            <!-- 首页内容将通过 JS 加载 -->
        </div>

        <!-- ===== 底部导航 ===== -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home')">
                <div class="nav-icon placeholder"></div>
                配售
            </div>
            <div class="nav-item" onclick="switchTab('predict')">
                <div class="nav-icon placeholder"></div>
                预测
            </div>
            <div class="nav-item" onclick="switchTab('openclaw')">
                <div class="nav-icon placeholder"></div>
                OpenClaw
            </div>
            <div class="nav-item" onclick="switchTab('community')">
                <div class="nav-icon placeholder"></div>
                社区
            </div>
            <div class="nav-item" onclick="switchTab('rewards')">
                <div class="nav-icon placeholder"></div>
                奖励
            </div>
        </div>
    </div>

    <!-- ===== 加载公共逻辑 ===== -->
    <script src="js/app.js"></script>

    <script>
        // ============================================================
        //  动态加载页面内容
        // ============================================================

        // 页面映射
        const pageMap = {
            'home': 'home.html',
            'openclaw': 'openclaw.html',
            'predict': null,
            'community': null,
            'rewards': null
        };

        // 加载页面
        function loadPage(pageName) {
            const container = document.getElementById('page-container');
            
            // 如果是空白页面
            if (!pageMap[pageName]) {
                container.innerHTML = `
                    <div style="display:flex;justify-content:center;align-items:center;height:80vh;color:#555;font-size:18px;">
                        ${pageName === 'predict' ? '预测界面 (空)' : 
                         pageName === 'community' ? '社区界面 (空)' : 
                         pageName === 'rewards' ? '奖励界面 (空)' : ''}
                    </div>
                `;
                return;
            }

            // 加载 HTML 文件
            fetch(pageMap[pageName])
                .then(response => {
                    if (!response.ok) {
                        throw new Error('页面加载失败');
                    }
                    return response.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    // 重新执行页面内的脚本
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        newScript.textContent = script.textContent;
                        document.body.appendChild(newScript);
                        document.body.removeChild(newScript);
                    });
                })
                .catch(error => {
                    console.error('加载页面出错:', error);
                    container.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:80vh;color:#ff4d4d;font-size:18px;">
                            页面加载失败，请检查文件是否存在
                        </div>
                    `;
                });
        }

        // 重写 switchTab 函数
        const originalSwitchTab = switchTab;
        switchTab = function(tabName) {
            // 移除所有导航激活状态
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            // 激活对应的导航项
            const navIndex = {
                'home': 0,
                'predict': 1,
                'openclaw': 2,
                'community': 3,
                'rewards': 4
            };
            if (navIndex[tabName] !== undefined) {
                document.querySelectorAll('.nav-item')[navIndex[tabName]].classList.add('active');
            }

            // 加载页面内容
            loadPage(tabName);
        };

        // 初始化加载首页
        document.addEventListener('DOMContentLoaded', function() {
            switchTab('home');
        });
    </script>
</body>
</html>
