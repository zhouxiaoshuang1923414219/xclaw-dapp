<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X.Claw DApp</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- 页面专用样式 -->
    <style>
        /* ... 所有页面样式 ... */
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="mobile-container">
        <!-- 顶部导航 -->
        <header>
            <div class="logo-area">
                <div class="logo-icon"></div>
                X.CLAW
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="walletConnectBtn" class="wallet-btn" onclick="toggleWallet()">
                    <span id="walletDot" class="wallet-dot"></span>
                    <span id="walletStatus">连接钱包</span>
                </button>
                <div style="font-size: 20px; cursor: pointer;">🌐</div>
            </div>
        </header>

        <!-- 页面容器 -->
        <div id="page-container"></div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home')">
                <div class="nav-icon placeholder"></div>
                配售
            </div>
            <div class="nav-item" onclick="switchTab('predict')">
                <div class="nav-icon placeholder"></div>
                预测
            </div>
            <div class="nav-item" onclick="switchTab('openclaw')">
                <div class="nav-icon placeholder"></div>
                OpenClaw
            </div>
            <div class="nav-item" onclick="switchTab('community')">
                <div class="nav-icon placeholder"></div>
                社区
            </div>
            <div class="nav-item" onclick="switchTab('rewards')">
                <div class="nav-icon placeholder"></div>
                奖励
            </div>
        </div>
    </div>

    <!-- 加载公共逻辑 -->
    <script src="js/app.js"></script>

    <script>
        // 页面映射
        const pageMap = {
            'home': 'home.html',
            'predict': 'predict.html',
            'openclaw': 'openclaw.html',
            'community': 'community.html',
            'rewards': 'rewards.html'
        };

        // 页面缓存
        const pageCache = {};

        function loadPage(pageName) {
            const container = document.getElementById('page-container');
            
            if (!pageMap[pageName]) {
                container.innerHTML = `
                    <div style="display:flex;justify-content:center;align-items:center;height:80vh;flex-direction:column;gap:20px;">
                        <div style="font-size:48px;">🔍</div>
                        <div style="color:#555;font-size:18px;">页面未找到</div>
                        <div style="color:#888;font-size:14px;">请检查页面映射配置</div>
                    </div>
                `;
                return;
            }

            // 如果已缓存，直接显示
            if (pageCache[pageName]) {
                container.innerHTML = pageCache[pageName];
                executeScripts(container);
                return;
            }

            // 显示加载动画
            container.innerHTML = `
                <div style="display:flex;justify-content:center;align-items:center;height:80vh;flex-direction:column;gap:20px;">
                    <div class="spinner-icon" style="width:40px;height:40px;border-width:4px;"></div>
                    <div style="color:#888;font-size:14px;">加载中...</div>
                </div>
            `;

            fetch(pageMap[pageName])
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    pageCache[pageName] = html;
                    container.innerHTML = html;
                    executeScripts(container);
                })
                .catch(error => {
                    console.error('加载页面出错:', error);
                    container.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:80vh;flex-direction:column;gap:20px;">
                            <div style="font-size:48px;">❌</div>
                            <div style="color:#ff4d4d;font-size:18px;">页面加载失败</div>
                            <div style="color:#888;font-size:14px;">${error.message}</div>
                            <div style="color:#888;font-size:12px;">请检查文件是否存在：${pageMap[pageName]}</div>
                        </div>
                    `;
                });
        }

        function executeScripts(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                newScript.textContent = script.textContent;
                document.body.appendChild(newScript);
                document.body.removeChild(newScript);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            const navIndex = {
                'home': 0,
                'predict': 1,
                'openclaw': 2,
                'community': 3,
                'rewards': 4
            };
            if (navIndex[tabName] !== undefined) {
                document.querySelectorAll('.nav-item')[navIndex[tabName]].classList.add('active');
            }

            loadPage(tabName);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            switchTab('home');
        });
    </script>
</body>
</html>
