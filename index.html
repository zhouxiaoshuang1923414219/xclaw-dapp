<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYK DApp</title>
    <style>
        /* ===== MYK 全局基础 ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background: radial-gradient(circle at 30% 10%, #1e2a4a, #0b0f1a);
            color: #ccd6f0;
            display: flex; justify-content: center; min-height: 100vh;
        }
        .mobile-container {
            width: 100%; max-width: 414px;
            padding: 70px 15px 80px 15px; position: relative; min-height: 100vh;
        }

        /* ===== 顶部导航 (毛玻璃) ===== */
        header {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 414px; z-index: 1000;
            background: rgba(18, 22, 40, 0.7);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 15px 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-area { display: flex; align-items: center; font-size: 18px; font-weight: bold; color: #f7c744; }
        .logo-icon { width: 20px; height: 20px; background: #f0b90b; margin-right: 8px; border-radius: 4px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
        .wallet-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #2d325a;
            padding: 6px 12px; border-radius: 20px; font-size: 12px; color: #fff;
            display: flex; align-items: center; cursor: pointer;
        }
        .wallet-btn.connected { border-color: #4ecca3; }
        .wallet-dot { width: 6px; height: 6px; background: #e94560; border-radius: 50%; margin-right: 6px; transition: 0.3s; }
        .wallet-dot.connected-dot { background: #4ecca3; }

        /* ===== 底部导航 (毛玻璃) ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 414px;
            background: rgba(18, 22, 40, 0.7);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; padding: 10px 0; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 10px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #f0b90b; }
        .nav-icon { width: 24px; height: 24px; margin-bottom: 4px; border-radius: 4px; display: block; }
        .nav-icon.placeholder { background-color: currentColor; opacity: 0.3; }
        .nav-item.active .nav-icon.placeholder { background-color: #f0b90b; opacity: 1; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: #0f1422; border: 1px solid #394056; border-left: 4px solid #e94560;
            color: #ccd6f0; padding: 10px 20px; border-radius: 8px; font-size: 14px;
            z-index: 9999; display: none; max-width: 90%; text-align: center;
            backdrop-filter: blur(8px);
        }
        .toast.success { border-left-color: #4ecca3; }
        .toast.error { border-left-color: #e94560; }

        #page-container { min-height: 60vh; }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="mobile-container">
        <header>
            <div class="logo-area"><div class="logo-icon"></div>MYK</div>
            <button id="walletConnectBtn" class="wallet-btn" onclick="toggleWallet()">
                <span id="walletDot" class="wallet-dot"></span>
                <span id="walletStatus">连接钱包</span>
            </button>
        </header>
        <div id="page-container"></div>
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home')"><div class="nav-icon placeholder"></div>配售</div>
            <div class="nav-item" onclick="switchTab('predict')"><div class="nav-icon placeholder"></div>预测</div>
            <div class="nav-item" onclick="switchTab('openclaw')"><div class="nav-icon placeholder"></div>OpenClaw</div>
            <div class="nav-item" onclick="switchTab('community')"><div class="nav-icon placeholder"></div>社区</div>
            <div class="nav-item" onclick="switchTab('rewards')"><div class="nav-icon placeholder"></div>奖励</div>
        </div>
    </div>
    <script>
        window.isConnected = false; window.currentAccount = null; window.mockBalance = 12.5;
        const pageMap = { 'home':'home.html', 'predict':'predict.html', 'openclaw':'openclaw.html', 'community':'community.html', 'rewards':'rewards.html' };
        function loadPage(name) {
            const c = document.getElementById('page-container');
            c.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:80vh;color:#a3adc9;font-size:14px;">加载中...</div>`;
            fetch(pageMap[name]).then(r=>r.text()).then(h=>{ c.innerHTML=h; c.querySelectorAll('script').forEach(s=>{ let ns=document.createElement('script'); ns.textContent=s.textContent; document.body.appendChild(ns); document.body.removeChild(ns); }); }).catch(()=>c.innerHTML=`<div style="color:#e94560;text-align:center;margin-top:40px;">加载失败</div>`);
        }
        function switchTab(name) {
            document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
            const idx = {'home':0,'predict':1,'openclaw':2,'community':3,'rewards':4};
            if(idx[name]!==undefined) document.querySelectorAll('.nav-item')[idx[name]].classList.add('active');
            loadPage(name);
        }
        function generateAddr(){ let a='0x'; for(let i=0;i<40;i++) a+='0123456789abcdef'[Math.floor(Math.random()*16)]; return a; }
        function fmtAddr(a){ return a ? a.substring(0,6)+'...'+a.substring(a.length-4) : ''; }
        function toggleWallet(){ window.isConnected ? disconnect() : connect(); }
        function connect(){ showToast('连接钱包...','info'); setTimeout(()=>{ window.currentAccount=generateAddr(); window.isConnected=true; updateUI(); showToast('连接成功','success'); },800); }
        function disconnect(){ window.isConnected=false; window.currentAccount=null; updateUI(); showToast('已断开','info'); }
        function updateUI(){ const b=document.getElementById('walletConnectBtn'), d=document.getElementById('walletDot'), s=document.getElementById('walletStatus'); if(window.isConnected&&window.currentAccount){ b.classList.add('connected'); d.classList.add('connected-dot'); s.textContent=fmtAddr(window.currentAccount); } else { b.classList.remove('connected'); d.classList.remove('connected-dot'); s.textContent='连接钱包'; } }
        function showToast(msg,t='info'){ const tEl=document.getElementById('toast'); tEl.textContent=msg; tEl.className='toast '+t; tEl.style.display='block'; clearTimeout(tEl._timer); tEl._timer=setTimeout(()=>tEl.style.display='none',3000); }
        document.addEventListener('DOMContentLoaded',()=>switchTab('home'));
    </script>
</body>
</html>
