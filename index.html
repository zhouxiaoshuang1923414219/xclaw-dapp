<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MYK 生态面板</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #1e2a4a, #0b0f1a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
            margin: 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 500px;
            background: rgba(18, 22, 40, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 80px 16px 90px 16px;
            position: relative;
            min-height: 100vh;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ===== 顶部导航 ===== */
        header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 468px;
            z-index: 1000;
            background: rgba(18, 22, 40, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #f7c744;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% {
                background: #e94560;
                box-shadow: 0 0 6px #e94560;
            }
            33% {
                background: #f0b90b;
                box-shadow: 0 0 6px #f0b90b;
            }
            66% {
                background: #4ecca3;
                box-shadow: 0 0 6px #4ecca3;
            }
            100% {
                background: #e94560;
                box-shadow: 0 0 6px #e94560;
            }
        }

        .wallet-btn {
            background: rgba(233, 69, 96, 0.15);
            border: 1px solid rgba(233, 69, 96, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .wallet-btn.connected {
            border-color: #4ecca3;
            background: rgba(78, 204, 163, 0.15);
        }

        .wallet-dot {
            width: 6px;
            height: 6px;
            background: #e94560;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .wallet-dot.connected-dot {
            background: #4ecca3;
        }

        /* ===== Toast 通知 ===== */
        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 9999;
            display: none;
            border: 1px solid #333;
            max-width: 90%;
            text-align: center;
            font-weight: 500;
        }

        .toast.success {
            border-color: #4ecca3;
        }
        .toast.error {
            border-color: #e94560;
        }
        .toast.info {
            border-color: #f0b90b;
        }

        /* ===== 底部导航 ===== */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 468px;
            background: rgba(18, 22, 40, 0.9);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 8px 4px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #7b85a6;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .nav-item.active {
            color: #f0b90b;
        }

        .nav-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        /* ===== 页面容器 ===== */
        #page-container {
            min-height: 60vh;
        }

        /* ===== 加载动画 ===== */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== 全局卡片样式（子页面可复用） ===== */
        .glass-card {
            background: rgba(18, 22, 40, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 18px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
            color: #fff;
        }

        .btn {
            background: linear-gradient(135deg, #e94560, #b92b4a);
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 16px rgba(233, 69, 96, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            width: 100%;
            font-size: 14px;
        }

        .btn:active {
            transform: scale(0.97);
        }
        .btn:disabled {
            opacity: 0.5;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .btn-green {
            background: linear-gradient(135deg, #4ecca3, #2e8b6a);
            box-shadow: 0 6px 16px rgba(78, 204, 163, 0.3);
        }

        .btn-gold {
            background: linear-gradient(135deg, #f0b90b, #e8a000);
            box-shadow: 0 6px 16px rgba(240, 185, 11, 0.3);
            color: #1a1a2e;
        }

        .btn-blue {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        .highlight {
            color: #4ef0a8;
            font-weight: 600;
        }

        .highlight-gold {
            color: #f0b90b;
            font-weight: 600;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
            color: #ccd6f0;
        }

        .stat-value {
            color: #4ef0a8;
            font-weight: 700;
        }

        .info-box {
            background: rgba(10, 13, 22, 0.8);
            border-radius: 12px;
            padding: 10px 12px;
            margin-top: 10px;
            font-size: 13px;
            border-left: 3px solid #e94560;
            word-break: break-word;
            color: #ccd6f0;
            display: none;
        }

        .info-box.success {
            border-left-color: #4ecca3;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="mobile-container">

        <!-- 顶部导航 -->
        <header>
            <div class="logo-area">
                <div class="logo-dot"></div>
                MYK 生态
            </div>
            <button id="walletConnectBtn" class="wallet-btn" onclick="toggleWallet()">
                <span id="walletDot" class="wallet-dot"></span>
                <span id="walletStatus">连接钱包</span>
            </button>
        </header>

        <!-- 动态内容容器 -->
        <div id="page-container"></div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('trade')">
                <span class="nav-icon">📈</span>
                交易
            </div>
            <div class="nav-item" onclick="switchTab('community')">
                <span class="nav-icon">🤝</span>
                参与社区
            </div>
            <div class="nav-item" onclick="switchTab('rewards')">
                <span class="nav-icon">🎁</span>
                领取福利
            </div>
            <div class="nav-item" onclick="switchTab('ecosystem')">
                <span class="nav-icon">🌐</span>
                生态
            </div>
            <div class="nav-item" onclick="switchTab('assets')">
                <span class="nav-icon">💼</span>
                资产管理
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 全局状态管理
        // ============================================================
        window.web3Instance = null;
        window.userAddress = null;
        window.isConnected = false;

        // MYK 合约地址（全局共享）
        window.MYK_ADDR = '0xc23CfEeC6D188D627C85106f682D9eb38d94192a';
        window.RP_ADDR = '0xD9772cb247913f0d61D2Ae5093Ad8dDd9a197f53';
        window.GOV_ADDR = '0x4Ee5EdB6625a183D04A1595b430C848A12b47CC9';
        window.FM_ADDR = '0x3a15A2947e116af89316B6f8b8BB54bf340A3d9f';
        window.USDT_ADDR = '0x55d398326f99059fF775485246999027B3197955';
        window.ROUTER_ADDR = '0x10ED43C718714eb63d5aA57B78B54704E256024E';

        // ============================================================
        // 页面路由与动态加载
        // ============================================================
        const pageMap = {
            'trade': 'trade.html',
            'community': 'community.html',
            'rewards': 'rewards.html',
            'ecosystem': 'ecosystem.html',
            'assets': 'assets.html'
        };

        function loadPage(pageName) {
            const container = document.getElementById('page-container');

            if (!pageMap[pageName]) {
                container.innerHTML =
                    '<div style="display:flex;justify-content:center;align-items:center;height:60vh;color:#e94560;font-size:16px;">页面加载失败：路径未定义</div>';
                return;
            }

            container.innerHTML = `
                <div style="display:flex;justify-content:center;align-items:center;height:60vh;flex-direction:column;gap:16px;">
                    <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top:3px solid #f0b90b;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
                    <div style="color:#888;font-size:13px;">加载中...</div>
                </div>
            `;

            fetch(pageMap[pageName])
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        newScript.textContent = script.textContent;
                        document.body.appendChild(newScript);
                        document.body.removeChild(newScript);
                    });
                })
                .catch(err => {
                    console.error('加载页面出错:', err);
                    container.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:60vh;color:#e94560;font-size:15px;text-align:center;padding:20px;">
                            加载失败<br><span style="font-size:11px;color:#888;">请检查文件：${pageMap[pageName]}</span>
                        </div>
                    `;
                });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const navIndex = { 'trade': 0, 'community': 1, 'rewards': 2, 'ecosystem': 3, 'assets': 4 };
            if (navIndex[tabName] !== undefined) {
                document.querySelectorAll('.nav-item')[navIndex[tabName]].classList.add('active');
            }
            loadPage(tabName);
        }

        // ============================================================
        // 钱包连接
        // ============================================================
        function a6(addr) {
            return addr ? addr.slice(0, 6) + '...' + addr.slice(-4) : '';
        }

        async function toggleWallet() {
            if (window.isConnected) {
                disconnectWallet();
            } else {
                await connectWallet();
            }
        }

        async function connectWallet() {
            if (!window.ethereum) {
                showToast('请安装 MetaMask 钱包', 'error');
                return;
            }
            try {
                showToast('正在连接钱包...', 'info');
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                window.web3Instance = new Web3(window.ethereum);
                window.userAddress = accounts[0];
                window.isConnected = true;
                updateWalletUI();
                showToast('钱包连接成功', 'success');
            } catch (e) {
                showToast('连接已取消或失败', 'error');
            }
        }

        function disconnectWallet() {
            window.isConnected = false;
            window.userAddress = null;
            window.web3Instance = null;
            updateWalletUI();
            showToast('已断开钱包连接', 'info');
        }

        function updateWalletUI() {
            const btn = document.getElementById('walletConnectBtn');
            const dot = document.getElementById('walletDot');
            const status = document.getElementById('walletStatus');

            if (window.isConnected && window.userAddress) {
                btn.classList.add('connected');
                dot.classList.add('connected-dot');
                status.textContent = a6(window.userAddress);
            } else {
                btn.classList.remove('connected');
                dot.classList.remove('connected-dot');
                status.textContent = '连接钱包';
            }
        }

        // ============================================================
        // Toast 通知
        // ============================================================
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            toast.style.display = 'block';
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ============================================================
        // 监听账户变化
        // ============================================================
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length > 0) {
                    window.userAddress = accounts[0];
                    window.isConnected = true;
                    window.web3Instance = new Web3(window.ethereum);
                } else {
                    window.userAddress = null;
                    window.isConnected = false;
                    window.web3Instance = null;
                }
                updateWalletUI();
            });
        }

        // ============================================================
        // 启动
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // 检查是否已连接
            if (window.ethereum) {
                window.ethereum.request({ method: 'eth_accounts' }).then(accounts => {
                    if (accounts.length > 0) {
                        window.userAddress = accounts[0];
                        window.isConnected = true;
                        window.web3Instance = new Web3(window.ethereum);
                        updateWalletUI();
                    }
                }).catch(() => {});
            }
            switchTab('trade');
        });
    </script>
</body>
</html>
