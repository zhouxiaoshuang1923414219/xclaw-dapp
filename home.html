<div id="page-home" class="page-container">
    <style>
        .glass-card { background: rgba(18,22,40,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; margin-bottom: 15px; }
        .title-left h2 { color: #f0b90b; font-size: 18px; } .title-left span { color: #a3adc9; font-size: 12px; }
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .progress-ring { position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; }
        .progress-text { position: absolute; font-size: 12px; font-weight: bold; color: #ccd6f0; }
        .status-badge { background: rgba(233,69,96,0.15); color: #e94560; font-size: 11px; padding: 4px 12px; border-radius: 12px; display: inline-flex; align-items: center; margin: 5px 0 15px; }
        .spinner-icon { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #f0b90b; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .stat-item { background: #0f1422; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-num { color: #4ecca3; font-size: 16px; font-weight: bold; } .stat-label { color: #888; font-size: 10px; margin-top: 4px; }
        .price-row { background: #0f1422; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; font-size: 14px; align-items: center; }
        .input-wrapper { margin-top: 10px; }
        .input-label { display: flex; justify-content: space-between; font-size: 13px; color: #a3adc9; margin-bottom: 5px; }
        .input-box { background: #0d1020; border: 1px solid #394056; border-radius: 12px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .input-box input { background: transparent; border: none; color: #ccd6f0; font-size: 18px; width: 60%; outline: none; }
        .max-btn { color: #f0b90b; font-weight: bold; font-size: 12px; cursor: pointer; }
        .token-tag { display: flex; align-items: center; font-size: 14px; color: #a3adc9; } .token-icon { width: 16px; height: 16px; background: #f0b90b; border-radius: 50%; margin-right: 5px; }
        .arrow-separator { text-align: center; color: #f0b90b; margin: 5px 0; font-size: 20px; }
        .btn { width: 100%; border: none; padding: 12px; border-radius: 25px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #e94560, #b92b4a); color: #fff; box-shadow: 0 4px 12px rgba(233,69,96,0.3); }
        .rules { font-size: 12px; color: #666; margin-top: 15px; } .rules li { list-style: none; margin-bottom: 4px; } .rules li::before { content: "• "; color: #f0b90b; }
    </style>

    <div class="glass-card">
        <div class="flex-row"><div class="title-left"><h2>先锋配售</h2><span>XClaw 先锋轮认购，限量 1,000,000,000 枚</span></div>
            <div class="progress-ring"><svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" stroke="rgba(255,255,255,0.1)" stroke-width="5" fill="none"/><circle cx="30" cy="30" r="25" stroke="#f0b90b" stroke-width="5" fill="none" stroke-dasharray="157" stroke-dashoffset="44"/></svg><span class="progress-text">72.07%</span></div>
        </div>
        <div class="status-badge"><span class="spinner-icon"></span> 认购进行中</div>
        <div class="stats-grid">
            <div class="stat-item"><span style="font-size:20px;color:#f0b90b;">👤</span><div class="stat-num">3,380</div><div class="stat-label">认购地址</div></div>
            <div class="stat-item"><span style="font-size:20px;color:#f0b90b;">💳</span><div class="stat-num">2,162.3</div><div class="stat-label">已认购(BNB)</div></div>
            <div class="stat-item"><span style="font-size:20px;color:#f0b90b;">🪙</span><div class="stat-num">540,575,000</div><div class="stat-label">已配售(XClaw)</div></div>
        </div>
        <div class="price-row"><span style="color:#a3adc9;">配售价格</span><span style="color:#f0b90b;font-weight:bold;">1 BNB = 250,000 XClaw</span></div>
    </div>

    <div class="glass-card">
        <div class="title-left"><h2 style="margin-bottom:10px;">参与配售</h2></div>
        <div class="input-wrapper">
            <div class="input-label"><span>认购金额</span><span>余额: <span id="bnbBalance" style="color:#4ecca3;">0</span> BNB</span></div>
            <div class="input-box">
                <input type="text" id="amountInput" placeholder="0.0">
                <div class="flex-row" style="gap:10px;"><span class="max-btn" onclick="setMaxAmount()">MAX</span><div class="token-tag"><div class="token-icon"></div> BNB</div></div>
            </div>
        </div>
        <div class="arrow-separator">▼</div>
        <div class="input-wrapper">
            <div class="input-label"><span>获得代币</span></div>
            <div class="input-box"><input type="text" id="outputAmount" value="0" disabled style="color:#fff;"><div class="token-tag"><div style="width:16px;height:16px;background:#e94560;border-radius:50%;margin-right:5px;"></div> XClaw</div></div>
        </div>
        <button class="btn btn-primary" onclick="confirmPurchase()">确认认购</button>
        <div class="rules"><li>首次认购最低 0.2 BNB，追加认购最低 0.1 BNB</li><li>单地址累计认购上限 5 BNB</li></div>
    </div>
    <script>
        const RATE=250000; document.getElementById('amountInput').addEventListener('input',function(){ document.getElementById('outputAmount').value=((parseFloat(this.value)||0)*RATE).toLocaleString(); });
        function setMaxAmount(){ if(!window.isConnected)return showToast('请先连接钱包','error'); const b=parseFloat(document.getElementById('bnbBalance').textContent); if(b>0){ document.getElementById('amountInput').value=b; document.getElementById('amountInput').dispatchEvent(new Event('input')); } }
        function confirmPurchase(){ if(!window.isConnected)return showToast('请先连接钱包','error'); const a=parseFloat(document.getElementById('amountInput').value); if(!a||a<=0)return showToast('请输入有效金额','error'); const b=parseFloat(document.getElementById('bnbBalance').textContent); if(a>b)return showToast('余额不足','error'); if(a<0.2)return showToast('最低 0.2 BNB','error'); if(a>5)return showToast('单地址上限 5 BNB','error'); showToast('交易处理中...','info'); setTimeout(()=>{ window.mockBalance-=a; document.getElementById('bnbBalance').textContent=window.mockBalance.toFixed(2); document.getElementById('amountInput').value=''; document.getElementById('outputAmount').value='0'; showToast(`认购成功! 获得 ${(a*RATE).toLocaleString()} XClaw`,'success'); },1500); }
        document.addEventListener('DOMContentLoaded',()=>{ document.getElementById('bnbBalance').textContent=window.mockBalance.toFixed(2); });
    </script>
</div>
