    </style>

    <script>
    (function() {
        // ===== 常量 =====
        const MYK = '0xc23CfEeC6D188D627C85106f682D9eb38d94192a';
        const RP = '0xD9772cb247913f0d61D2Ae5093Ad8dDd9a197f53';
        const USDT = '0x55d398326f99059fF775485246999027B3197955';
        const ROUTER = '0x10ED43C718714eb63d5aA57B78B54704E256024E';
        const PAIR = '0xCa4F4a81ed8a5f953f0Ea07d7Ee4e65969a33156';
        const SWAP_SIG = 'swapExactTokensForTokensSupportingFeeOnTransferTokens(uint256,uint256,address[],address,uint256)';
        const PCS_API = 'https://api.pancakeswap.info/api/v2/tokens/0xc23CfEeC6D188D627C85106f682D9eb38d94192a';
        const STORAGE_KEY = 'myk_baseline_price';

        let buySlippage = 0.005;
        let sellSlippage = 0.005;
        let spotPrice = '1000000000000000000';
        let isProcessing = false;

        function $(id) { return document.getElementById(id); }
        function n(w) { return parseFloat(Web3.utils.fromWei(w + '', 'ether')); }
        function formatPrice(p) {
            if (p >= 1) return p.toFixed(2);
            if (p >= 0.01) return p.toFixed(4);
            if (p >= 0.0001) return p.toFixed(6);
            return p.toFixed(8);
        }
        function getTodayKey() {
            const d = new Date();
            return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
        }
        function getBaselinePrice() {
            try {
                const s = localStorage.getItem(STORAGE_KEY);
                if (!s) return null;
                const d = JSON.parse(s);
                if (d.date === getTodayKey()) return d.price;
                localStorage.removeItem(STORAGE_KEY);
                return null;
            } catch (e) { return null; }
        }
        function setBaselinePrice(p) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: getTodayKey(), price: p })); } catch (e) {}
        }
        function calcChange(cp, bp) {
            if (!bp || bp <= 0 || cp <= 0) return null;
            return ((cp - bp) / bp) * 100;
        }
        async function fetchPCSChange() {
            try {
                const r = await fetch(PCS_API);
                const d = await r.json();
                if (d && d.data && d.data.price_change_24h) {
                    return { change: d.data.price_change_24h };
                }
            } catch (e) {}
            return null;
        }
        function getLocalChange(price) {
            let bp = getBaselinePrice();
            if (!bp) { setBaselinePrice(price); bp = price; }
            const ch = calcChange(price, bp);
            if (ch === null) return { change: '0.00%' };
            const sign = ch > 0 ? '+' : '';
            return { change: sign + ch.toFixed(2) + '%' };
        }
        function encodeCall(sig, types, values) {
            const s = web3.eth.abi.encodeFunctionSignature(sig);
            if (!types || !types.length) return s;
            const e = web3.eth.abi.encodeParameters(types, values);
            return s + e.slice(2);
        }
        function parseError(e) {
            const m = e?.message || '';
            const mc = m.match(/execution reverted:\s*(.+?)(?:"|$)/);
            if (mc) return mc[1].trim();
            const m2 = m.match(/reason="([^"]+)"/);
            if (m2) return m2[1];
            return m.slice(0, 200);
        }
        function lock() {
            if (isProcessing) { alert('请等待当前操作完成'); return false; }
            isProcessing = true;
            return true;
        }
        function unlock() { isProcessing = false; }
        function calcMinOutput(amountOut, slippage) {
            const a = BigInt(amountOut);
            const num = BigInt(Math.round((1 - slippage) * 10000));
            return (a * num / BigInt(10000)).toString();
        }
        async function waitForTransaction(txHash) {
            for (let i = 0; i < 30; i++) {
                try {
                    const r = await web3.eth.getTransactionReceipt(txHash);
                    if (r) {
                        if (r.status) return r;
                        else throw new Error('交易失败');
                    }
                } catch (e) {
                    if (i === 29) throw e;
                }
                await new Promise(r => setTimeout(r, 2000));
            }
            throw new Error('超时');
        }

        // ===== 新增：获取用户余额 =====
        async function fetchBalances() {
            const userAddress = window.currentAccount;
            if (!userAddress || !web3) {
                $('usdtBalance').textContent = '--';
                $('mykBalanceBuy').textContent = '--';
                $('mykBalanceSell').textContent = '--';
                $('usdtBalanceSell').textContent = '--';
                return;
            }
            try {
                // USDT 余额
                const usdtResult = await web3.eth.call({
                    to: USDT,
                    data: encodeCall('balanceOf(address)', ['address'], [userAddress])
                });
                const usdtBal = n(web3.eth.abi.decodeParameter('uint256', usdtResult));
                $('usdtBalance').textContent = usdtBal.toFixed(4);
                $('usdtBalanceSell').textContent = usdtBal.toFixed(4);

                // MYK 余额
                const mykResult = await web3.eth.call({
                    to: MYK,
                    data: encodeCall('balanceOf(address)', ['address'], [userAddress])
                });
                const mykBal = n(web3.eth.abi.decodeParameter('uint256', mykResult));
                $('mykBalanceBuy').textContent = mykBal.toFixed(4);
                $('mykBalanceSell').textContent = mykBal.toFixed(4);
            } catch (e) {
                $('usdtBalance').textContent = '--';
                $('mykBalanceBuy').textContent = '--';
                $('mykBalanceSell').textContent = '--';
                $('usdtBalanceSell').textContent = '--';
            }
        }

        // ===== MAX 按钮：填入最大余额 =====
        function setupMaxButtons() {
            // 买入 MAX 按钮
            $('buyMaxBtn').addEventListener('click', function() {
                const usdtText = $('usdtBalance').textContent;
                const usdtBal = parseFloat(usdtText);
                if (!isNaN(usdtBal) && usdtBal > 0) {
                    $('buyUSDTAmount').value = usdtBal.toFixed(4);
                    updateBuyQuote();
                }
            });

            // 卖出 MAX 按钮
            $('sellMaxBtn').addEventListener('click', function() {
                const mykText = $('mykBalanceSell').textContent;
                const mykBal = parseFloat(mykText);
                if (!isNaN(mykBal) && mykBal > 0) {
                    $('sellMYKAmount').value = mykBal.toFixed(4);
                    updateSellQuote();
                }
            });
        }

        // ===== 价格获取（三级降级策略） =====
        async function fetchPrice() {
            try {
                if (!web3) return;

                // 第一级：RewardPool.getCurrentPrice()
                try {
                    const result = await web3.eth.call({
                        to: RP,
                        data: encodeCall('getCurrentPrice()')
                    });
                    spotPrice = result;
                } catch (e1) {
                    // 第二级：Router.getAmountsOut(1 MYK → USDT)
                    try {
                        const ra = [{"constant":true,"inputs":[{"internalType":"uint256","name":"amountIn","type":"uint256"},{"internalType":"address[]","name":"path","type":"address[]"}],"name":"getAmountsOut","outputs":[{"internalType":"uint256[]","name":"amounts","type":"uint256[]"}],"type":"function"}];
                        const rc = new web3.eth.Contract(ra, ROUTER);
                        const oneMYK = Web3.utils.toWei('1', 'ether');
                        const amounts = await rc.methods.getAmountsOut(oneMYK, [MYK, USDT]).call();
                        spotPrice = Web3.utils.toWei(String(n(amounts[1])), 'ether');
                    } catch (e2) {
                        // 第三级：Pair.getReserves() 反推
                        try {
                            const pa = [{"constant":true,"inputs":[],"name":"getReserves","outputs":[{"internalType":"uint112","name":"_reserve0","type":"uint112"},{"internalType":"uint112","name":"_reserve1","type":"uint112"},{"internalType":"uint32","name":"_blockTimestampLast","type":"uint32"}],"type":"function"},{"constant":true,"inputs":[],"name":"token0","outputs":[{"internalType":"address","name":"","type":"address"}],"type":"function"}];
                            const pc = new web3.eth.Contract(pa, PAIR);
                            const t0 = await pc.methods.token0().call();
                            const rv = await pc.methods.getReserves().call();
                            const r0 = BigInt(rv[0]), r1 = BigInt(rv[1]);
                            if (r0 === BigInt(0) || r1 === BigInt(0)) throw new Error('0');
                            let rU, rM;
                            if (t0.toLowerCase() === USDT.toLowerCase()) {
                                rU = r0; rM = r1;
                            } else {
                                rU = r1; rM = r0;
                            }
                            spotPrice = ((rU * BigInt(10 ** 18)) / rM).toString();
                        } catch (e3) {}
                    }
                }

                const sp = n(spotPrice);
                const pcs = await fetchPCSChange();
                if (pcs) {
                    updatePriceDisplay(sp, pcs.change);
                } else {
                    const lr = getLocalChange(sp);
                    updatePriceDisplay(sp, lr.change);
                }
                updateOrderPanel();
                updateBuyQuote();
                updateSellQuote();
                // 新增：同时刷新余额
                fetchBalances();
            } catch (e) {
                $('tradePriceDisplay').textContent = '--';
                $('tradePriceBadge').className = 'trade-price-badge price-change-flat';
                $('tradeChangeDisplay').textContent = '--';
            }
        }

        function updatePriceDisplay(price, changeStr) {
            $('tradePriceDisplay').textContent = formatPrice(price);
            const ce = $('tradeChangeDisplay');
            const bd = $('tradePriceBadge');
            ce.textContent = changeStr;
            if (changeStr.startsWith('+')) {
                bd.className = 'trade-price-badge price-change-up';
            } else if (changeStr.startsWith('-')) {
                bd.className = 'trade-price-badge price-change-down';
            } else {
                bd.className = 'trade-price-badge price-change-flat';
            }
        }

        async function updateOrderPanel() {
            try {
                if (!web3) return;
                const ra = [{"constant":true,"inputs":[{"internalType":"uint256","name":"amountIn","type":"uint256"},{"internalType":"address[]","name":"path","type":"address[]"}],"name":"getAmountsOut","outputs":[{"internalType":"uint256[]","name":"amounts","type":"uint256[]"}],"type":"function"}];
                const rc = new web3.eth.Contract(ra, ROUTER);
                const oneMYK = Web3.utils.toWei('1', 'ether');
                const oneUSDT = Web3.utils.toWei('1', 'ether');
                const sellAmounts = await rc.methods.getAmountsOut(oneMYK, [MYK, USDT]).call();
                const sellPrice = n(sellAmounts[1]);
                const buyAmounts = await rc.methods.getAmountsOut(oneUSDT, [USDT, MYK]).call();
                const buyRate = n(buyAmounts[1]);
                $('buyRateDisplay').textContent = buyRate.toFixed(4);
                $('sellRateDisplay').textContent = sellPrice.toFixed(6);
                $('buyPriceDisplay').textContent = '$' + sellPrice.toFixed(6);
                $('sellPriceDisplay').textContent = '$' + sellPrice.toFixed(6);
            } catch (e) {}
        }

        async function getSwapQuote(amountIn, path) {
            try {
                const ra = [{"constant":true,"inputs":[{"internalType":"uint256","name":"amountIn","type":"uint256"},{"internalType":"address[]","name":"path","type":"address[]"}],"name":"getAmountsOut","outputs":[{"internalType":"uint256[]","name":"amounts","type":"uint256[]"}],"type":"function"}];
                const rc = new web3.eth.Contract(ra, ROUTER);
                const ams = await rc.methods.getAmountsOut(amountIn, path).call();
                return ams[1];
            } catch (e) {
                const sp = n(spotPrice);
                if (isNaN(sp) || sp <= 0) return '0';
                const an = n(amountIn);
                if (path[0].toLowerCase() === USDT.toLowerCase()) {
                    return Web3.utils.toWei(String(an / sp), 'ether');
                } else {
                    return Web3.utils.toWei(String(an * sp), 'ether');
                }
            }
        }

        async function updateBuyQuote() {
            const ua = parseFloat($('buyUSDTAmount').value) || 0;
            if (ua <= 0) { $('expectedMYK').textContent = '--'; return; }
            try {
                const uw = Web3.utils.toWei(String(ua), 'ether');
                const mo = await getSwapQuote(uw, [USDT, MYK]);
                const ms = n(mo) * (1 - buySlippage);
                $('expectedMYK').textContent = ms.toFixed(4);
            } catch (e) { $('expectedMYK').textContent = '--'; }
        }

        async function updateSellQuote() {
            const ma = parseFloat($('sellMYKAmount').value) || 0;
            if (ma <= 0) { $('expectedUSDT').textContent = '--'; return; }
            try {
                const mw = Web3.utils.toWei(String(ma), 'ether');
                const uo = await getSwapQuote(mw, [MYK, USDT]);
                const us = n(uo) * (1 - sellSlippage);
                $('expectedUSDT').textContent = us.toFixed(6);
            } catch (e) { $('expectedUSDT').textContent = '--'; }
        }

        async function buyMYK() {
            const userAddress = window.currentAccount;
            if (!userAddress) { alert('请先连接钱包'); return; }
            if (!lock()) return;

            const b = $('buyMYKBtn');
            const el = $('buyResult');
            const ua = parseFloat($('buyUSDTAmount').value);

            if (!ua || ua <= 0) { alert('请输入有效的USDT数量'); unlock(); return; }

            el.style.display = 'block';
            b.disabled = true;
            b.textContent = '处理中...';

            try {
                const uw = Web3.utils.toWei(String(ua), 'ether');
                const dl = Math.floor(Date.now() / 1000) + 300;

                el.innerHTML = '⏳ 查询报价...';
                const mo = await getSwapQuote(uw, [USDT, MYK]);
                const mm = calcMinOutput(mo, buySlippage);

                el.innerHTML = '⏳ 检查余额...';
                const br = await web3.eth.call({
                    to: USDT,
                    data: encodeCall('balanceOf(address)', ['address'], [userAddress])
                });
                if (BigInt(web3.eth.abi.decodeParameter('uint256', br)) < BigInt(uw)) {
                    throw new Error('USDT余额不足');
                }

                el.innerHTML = '⏳ 授权 USDT...';
                const aTx = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: userAddress,
                        to: USDT,
                        data: encodeCall('approve(address,uint256)', ['address', 'uint256'], [ROUTER, uw])
                    }]
                });
                el.innerHTML = '⏳ 等待授权确认...';
                await waitForTransaction(aTx);

                el.innerHTML = '⏳ 买入 MYK...';
                const sTx = await window.ethereum.request({
                    method: 'eth_sendTransaction',
                    params: [{
                        from: userAddress,
                        to: ROUTER,
                        data: encodeCall(SWAP_SIG,
                            ['uint256', 'uint256', 'address[]', 'address', 'uint256'],
                            [uw, mm, [USDT, MYK], userAddress, String(dl)]
                        )
                    }]
                });
                el.innerHTML = '⏳ 等待交易确认...';
                await waitForTransaction(sTx);

                el.innerHTML = '✅ 买入成功！';
                el.style.borderLeftColor = '#4ecca3';
                el.style.background = 'rgba(78,204,163,0.1)';
                setTimeout(() => { fetchPrice(); }, 3000);
            } catch (e) {
                const m = parseError(e);
                el.innerHTML = m.includes('User denied') || m.includes('rejected')
                    ? '⚠️ 交易已取消'
                    : m.includes('insufficient')
                    ? '⚠️ 余额不足'
                    : '❌ ' + m;
            } finally {
                b.disabled = false;
                b.textContent = '🟢 买入 MYK';
                unlock();
            }
        }

        function setupSlippageButtons() {
            document.querySelectorAll('#panelBuy .slippage-btn').forEach(b => {
                b.addEventListener('click', function() {
                    document.querySelectorAll('#panelBuy .slippage-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    buySlippage = parseFloat(this.dataset.slip) / 100;
                    updateBuyQuote();
                });
            });
            document.querySelectorAll('#panelSell .slippage-btn').forEach(b => {
                b.addEventListener('click', function() {
                    document.querySelectorAll('#panelSell .slippage-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    sellSlippage = parseFloat(this.dataset.slip) / 100;
                    updateSellQuote();
                });
            });
        }

        function setupTabs() {
            document.querySelectorAll('#tradeTabSwitch .tab').forEach(t => {
                t.addEventListener('click', function() {
                    document.querySelectorAll('#tradeTabSwitch .tab').forEach(x => {
                        x.classList.remove('active', 'tab-buy', 'tab-sell');
                    });
                    this.classList.add('active');
                    const tb = this.dataset.tab;
                    if (tb === 'buy') this.classList.add('tab-buy');
                    if (tb === 'sell') this.classList.add('tab-sell');
                    $('panelBuy').style.display = tb === 'buy' ? 'block' : 'none';
                    $('panelSell').style.display = tb === 'sell' ? 'block' : 'none';
                    if (tb === 'buy') updateBuyQuote();
                    if (tb === 'sell') updateSellQuote();
                });
            });
        }

        function startPriceAutoRefresh() {
            fetchPrice().then(() => {
                updateBuyQuote();
                updateSellQuote();
            });
            setInterval(() => {
                const s = localStorage.getItem(STORAGE_KEY);
                if (s) {
                    try {
                        const d = JSON.parse(s);
                        if (d.date !== getTodayKey()) localStorage.removeItem(STORAGE_KEY);
                    } catch (e) {}
                }
                fetchPrice().then(() => {
                    updateBuyQuote();
                    updateSellQuote();
                });
            }, 30000);
        }

        function init() {
            setupTabs();
            setupSlippageButtons();
            setupMaxButtons();
            $('buyUSDTAmount').addEventListener('input', updateBuyQuote);
            $('sellMYKAmount').addEventListener('input', updateSellQuote);
            $('buyMYKBtn').addEventListener('click', buyMYK);
            $('sellMYKBtn').addEventListener('click', sellMYK);

            if (typeof web3 !== 'undefined' && web3) {
                startPriceAutoRefresh();
            } else {
                const checkWeb3 = setInterval(() => {
                    if (typeof web3 !== 'undefined' && web3) {
                        clearInterval(checkWeb3);
                        startPriceAutoRefresh();
                    }
                }, 500);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</div>
