<div id="page-trade" class="page-content">
    <style>
        .trade-tabs {
            display: flex;
            background: #0c0f1c;
            border-radius: 14px;
            padding: 3px;
            margin: 12px 0;
            border: 1px solid #2d3355;
        }
        .trade-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            color: #9aa0c0;
            cursor: pointer;
            transition: 0.2s;
        }
        .trade-tab.active.buy {
            background: #4ecca3;
            color: #fff;
        }
        .trade-tab.active.sell {
            background: #e94560;
            color: #fff;
        }
        .input-field {
            background: #0d1020;
            border: 1px solid #394056;
            border-radius: 14px;
            padding: 12px 14px;
            color: #fff;
            width: 100%;
            margin: 8px 0;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-field:focus {
            border-color: #f0b90b;
        }
        .slippage-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 8px 0;
            flex-wrap: wrap;
        }
        .slippage-btn {
            padding: 5px 10px;
            border-radius: 10px;
            background: #2d325a;
            border: 1px solid #394056;
            color: #aaa;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: 0.2s;
        }
        .slippage-btn.active {
            background: #f0b90b;
            color: #1a1a2e;
            border-color: #f0b90b;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
            color: #a3adc9;
        }
        .price-value {
            color: #4ef0a8;
            font-weight: 700;
        }
        .order-panel {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: rgba(15, 20, 34, 0.8);
            border-radius: 12px;
            border: 1px solid #2a2f52;
            margin-bottom: 10px;
        }
    </style>

    <div class="glass-card">
        <h2 style="color:#f0b90b;margin-bottom:4px;">📈 买卖 MYK</h2>
        <div class="order-panel">
            <div style="flex:1;text-align:center;">
                <div style="font-size:10px;color:#888;">买入价</div>
                <div style="font-size:14px;color:#4ecca3;font-weight:700;" id="buyPriceDisplay">--</div>
                <div style="font-size:10px;color:#666;">1 USDT = <span id="buyRateDisplay">--</span> MYK</div>
            </div>
            <div style="width:1px;background:#2a2f52;"></div>
            <div style="flex:1;text-align:center;">
                <div style="font-size:10px;color:#888;">卖出价</div>
                <div style="font-size:14px;color:#e94560;font-weight:700;" id="sellPriceDisplay">--</div>
                <div style="font-size:10px;color:#666;">1 MYK = <span id="sellRateDisplay">--</span> USDT</div>
            </div>
        </div>

        <div class="trade-tabs" id="tradeTabSwitch">
            <div class="trade-tab active buy" data-tab="buy">🟢 买入 MYK</div>
            <div class="trade-tab sell" data-tab="sell">🔴 卖出 MYK</div>
        </div>

        <div id="panelBuy">
            <div class="slippage-row">
                <span style="color:#aaa;font-size:11px;">滑点:</span>
                <span class="slippage-btn" data-slip="0.3">0.3%</span>
                <span class="slippage-btn active" data-slip="0.5">0.5%</span>
                <span class="slippage-btn" data-slip="1">1%</span>
                <span class="slippage-btn" data-slip="3">3%</span>
            </div>
            <input class="input-field" id="buyUSDTAmount" type="number" placeholder="支付 USDT 数量" value="10" step="0.1" min="0">
            <div class="price-row">
                <span>预计获得:</span>
                <span class="price-value" id="expectedMYK">--</span> MYK
            </div>
            <button class="btn btn-green" id="buyMYKBtn">🟢 买入 MYK</button>
            <div class="info-box" id="buyResult"></div>
        </div>

        <div id="panelSell" style="display:none;">
            <div class="slippage-row">
                <span style="color:#aaa;font-size:11px;">滑点:</span>
                <span class="slippage-btn" data-slip="0.3">0.3%</span>
                <span class="slippage-btn active" data-slip="0.5">0.5%</span>
                <span class="slippage-btn" data-slip="1">1%</span>
                <span class="slippage-btn" data-slip="3">3%</span>
            </div>
            <input class="input-field" id="sellMYKAmount" type="number" placeholder="卖出 MYK 数量" value="10" step="0.1" min="0">
            <div class="price-row">
                <span>预计获得:</span>
                <span class="price-value" id="expectedUSDT">--</span> USDT
            </div>
            <button class="btn" id="sellMYKBtn" style="background:linear-gradient(135deg,#e94560,#ff6b6b);">🔴 卖出 MYK</button>
            <div class="info-box" id="sellResult"></div>
        </div>
    </div>

    <script>
        // 交易页面逻辑（简化版，完整逻辑可参考原MYK面板）
        const MYK = window.MYK_ADDR;
        const USDT = window.USDT_ADDR;
        const ROUTER = window.ROUTER_ADDR;
        let buySlippage = 0.005;
        let sellSlippage = 0.005;

        function encodeCall(sig, types = [], values = []) {
            const web3 = window.web3Instance;
            if (!web3) return '';
            const s = web3.eth.abi.encodeFunctionSignature(sig);
            if (!types.length) return s;
            const e = web3.eth.abi.encodeParameters(types, values);
            return s + e.slice(2);
        }

        function n(w) { return parseFloat(Web3.utils.fromWei(w + '', 'ether')); }

        function formatPrice(p) {
            if (p >= 1) return p.toFixed(2);
            if (p >= 0.01) return p.toFixed(4);
            if (p >= 0.0001) return p.toFixed(6);
            return p.toFixed(8);
        }

        async function getSwapQuote(amountIn, path) {
            const web3 = window.web3Instance;
            if (!web3) return '0';
            try {
                const ra = [{ "constant": true, "inputs": [{ "internalType": "uint256", "name": "amountIn", "type": "uint256" }, { "internalType": "address[]", "name": "path", "type": "address[]" }], "name": "getAmountsOut", "outputs": [{ "internalType": "uint256[]", "name": "amounts", "type": "uint256[]" }], "type": "function" }];
                const rc = new web3.eth.Contract(ra, ROUTER);
                const amounts = await rc.methods.getAmountsOut(amountIn, path).call();
                return amounts[1];
            } catch (e) {
                return '0';
            }
        }

        async function updateBuyQuote() {
            const amount = parseFloat(document.getElementById('buyUSDTAmount').value) || 0;
            if (amount <= 0 || !window.web3Instance) {
                document.getElementById('expectedMYK').textContent = '--';
                return;
            }
            try {
                const uw = Web3.utils.toWei(String(amount), 'ether');
                const mo = await getSwapQuote(uw, [USDT, MYK]);
                const ms = n(mo) * (1 - buySlippage);
                document.getElementById('expectedMYK').textContent = ms.toFixed(4);
            } catch (e) {
                document.getElementById('expectedMYK').textContent = '--';
            }
        }

        async function updateSellQuote() {
            const amount = parseFloat(document.getElementById('sellMYKAmount').value) || 0;
            if (amount <= 0 || !window.web3Instance) {
                document.getElementById('expectedUSDT').textContent = '--';
                return;
            }
            try {
                const mw = Web3.utils.toWei(String(amount), 'ether');
                const uo = await getSwapQuote(mw, [MYK, USDT]);
                const us = n(uo) * (1 - sellSlippage);
                document.getElementById('expectedUSDT').textContent = us.toFixed(6);
            } catch (e) {
                document.getElementById('expectedUSDT').textContent = '--';
            }
        }

        async function updateOrderPanel() {
            if (!window.web3Instance) return;
            try {
                const ra = [{ "constant": true, "inputs": [{ "internalType": "uint256", "name": "amountIn", "type": "uint256" }, { "internalType": "address[]", "name": "path", "type": "address[]" }], "name": "getAmountsOut", "outputs": [{ "internalType": "uint256[]", "name": "amounts", "type": "uint256[]" }], "type": "function" }];
                const rc = new window.web3Instance.eth.Contract(ra, ROUTER);
                const oneMYK = Web3.utils.toWei('1', 'ether');
                const oneUSDT = Web3.utils.toWei('1', 'ether');
                const sellAmounts = await rc.methods.getAmountsOut(oneMYK, [MYK, USDT]).call();
                const sellPrice = n(sellAmounts[1]);
                const buyAmounts = await rc.methods.getAmountsOut(oneUSDT, [USDT, MYK]).call();
                const buyRate = n(buyAmounts[1]);
                document.getElementById('buyRateDisplay').textContent = buyRate.toFixed(4);
                document.getElementById('sellRateDisplay').textContent = sellPrice.toFixed(6);
                document.getElementById('buyPriceDisplay').textContent = '$' + sellPrice.toFixed(6);
                document.getElementById('sellPriceDisplay').textContent = '$' + sellPrice.toFixed(6);
            } catch (e) {}
        }

        async function buyMYK() {
            if (!window.isConnected) { showToast('请先连接钱包', 'error'); return; }
            const web3 = window.web3Instance;
            const userAddress = window.userAddress;
            const amount = parseFloat(document.getElementById('buyUSDTAmount').value);
            if (!amount || amount <= 0) { showToast('请输入有效的USDT数量', 'error'); return; }
            const btn = document.getElementById('buyMYKBtn');
            const el = document.getElementById('buyResult');
            btn.disabled = true;
            btn.textContent = '处理中...';
            el.style.display = 'block';
            try {
                const uw = Web3.utils.toWei(String(amount), 'ether');
                const dl = Math.floor(Date.now() / 1000) + 300;
                el.innerHTML = '⏳ 授权 USDT...';
                const aTx = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: userAddress, to: USDT, data: encodeCall('approve(address,uint256)', ['address', 'uint256'], [ROUTER, uw]) }] });
                await waitForReceipt(aTx);
                el.innerHTML = '⏳ 买入 MYK...';
                const mo = await getSwapQuote(uw, [USDT, MYK]);
                const mm = (BigInt(mo) * BigInt(Math.round((1 - buySlippage) * 10000)) / BigInt(10000)).toString();
                const sTx = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: userAddress, to: ROUTER, data: encodeCall('swapExactTokensForTokensSupportingFeeOnTransferTokens(uint256,uint256,address[],address,uint256)', ['uint256', 'uint256', 'address[]', 'address', 'uint256'], [uw, mm, [USDT, MYK], userAddress, String(dl)]) }] });
                await waitForReceipt(sTx);
                el.innerHTML = '✅ 买入成功！';
                el.className = 'info-box success';
            } catch (e) {
                el.innerHTML = '❌ ' + (e.message || '交易失败').slice(0, 200);
            } finally {
                btn.disabled = false;
                btn.textContent = '🟢 买入 MYK';
            }
        }

        async function waitForReceipt(txHash, maxAttempts = 30) {
            const web3 = window.web3Instance;
            for (let i = 0; i < maxAttempts; i++) {
                try {
                    const r = await web3.eth.getTransactionReceipt(txHash);
                    if (r) { if (r.status) return r;
                        throw new Error('交易失败'); }
                } catch (e) { if (i === maxAttempts - 1) throw e; }
                await new Promise(r => setTimeout(r, 2000));
            }
            throw new Error('超时');
        }

        // 事件绑定
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('buyUSDTAmount').addEventListener('input', updateBuyQuote);
            document.getElementById('sellMYKAmount').addEventListener('input', updateSellQuote);
            document.getElementById('buyMYKBtn').addEventListener('click', buyMYK);
            document.getElementById('sellMYKBtn').addEventListener('click', () => showToast('卖出功能开发中...', 'info'));

            // 滑点按钮
            document.querySelectorAll('#panelBuy .slippage-btn').forEach(b => {
                b.addEventListener('click', function() {
                    document.querySelectorAll('#panelBuy .slippage-btn').forEach(x => x.classList.remove('active'));
                    this.classList.add('active');
                    buySlippage = parseFloat(this.dataset.slip) / 100;
                    updateBuyQuote();
                });
            });

            // Tab 切换
            document.querySelectorAll('#tradeTabSwitch .trade-tab').forEach(t => {
                t.addEventListener('click', function() {
                    document.querySelectorAll('#tradeTabSwitch .trade-tab').forEach(x => { x.classList.remove('active', 'buy', 'sell'); });
                    this.classList.add('active');
                    const tb = this.dataset.tab;
                    if (tb === 'buy') this.classList.add('buy');
                    if (tb === 'sell') this.classList.add('sell');
                    document.getElementById('panelBuy').style.display = tb === 'buy' ? 'block' : 'none';
                    document.getElementById('panelSell').style.display = tb === 'sell' ? 'block' : 'none';
                });
            });

            if (window.isConnected) updateOrderPanel();
        });
    </script>
</div>
