<div id="page-community" class="page-container">
    <style>
        .glass-card { background: rgba(18,22,40,0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 16px; margin-bottom: 15px; color: #ccd6f0; }
        .flex-row { display: flex; justify-content: space-between; align-items: center; }
        .title-main { color: #f0b90b; font-size: 18px; font-weight: bold; }
        .desc { color: #a3adc9; font-size: 13px; }
        .invite-input { background: rgba(0,0,0,0.3); border: 1px solid #394056; border-radius: 12px; padding: 10px 16px; margin-bottom: 12px; font-size: 14px; color: #f0b90b; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; }
        .action-row { display: flex; gap: 12px; }
        .action-btn { flex:1; background:rgba(0,0,0,0.3); border:1px solid #394056; border-radius:12px; padding:10px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; color:#ccd6f0; font-size:14px; transition:0.3s; }
        .action-btn:hover { border-color:#f0b90b; } .action-btn .icon { color:#f0b90b; }
        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .data-item { background: rgba(0,0,0,0.2); border-radius: 12px; padding: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .data-item .label { font-size: 13px; color: #888; margin-bottom: 4px; }
        .data-item .val { font-size: 20px; font-weight: bold; color: #4ecca3; }
        .data-item .unit { font-size: 12px; color: #a3adc9; margin-left: 4px; }
    </style>

    <div class="glass-card">
        <div class="flex-row"><div class="title-main">社区</div></div>
        <div class="desc" style="margin-bottom:12px;">邀请好友，共建社区，赚取推荐奖励</div>
        <div class="invite-input">https://dapp.myk...E5Ed</div>
        <div class="action-row">
            <button class="action-btn" onclick="copyLink()"><span class="icon">📋</span> 复制链接</button>
            <button class="action-btn" onclick="showToast('二维码功能开发中', 'info')"><span class="icon">📱</span> 二维码</button>
        </div>
    </div>

    <div class="glass-card">
        <div class="flex-row"><div class="title-main">社区数据</div><span class="desc" style="cursor:pointer;">查看直推 ›</span></div>
        <div class="data-grid" style="margin-top:12px;">
            <div class="data-item"><div class="label">直推人数</div><div class="val">0</div></div>
            <div class="data-item"><div class="label">团队人数</div><div class="val">0</div></div>
            <div class="data-item"><div class="label">团队认购</div><div class="val">0<span class="unit">BNB</span></div></div>
            <div class="data-item"><div class="label">小区认购</div><div class="val">0<span class="unit">BNB</span></div></div>
        </div>
    </div>
    <script>
        function copyLink(){ const link='https://dapp.myk.io/ref/0x'+(window.currentAccount?window.currentAccount.substring(2,8):'123456'); if(navigator.clipboard){navigator.clipboard.writeText(link).then(()=>showToast('链接已复制','success'));}else{const ta=document.createElement('textarea'); ta.value=link; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('链接已复制','success');} }
    </script>
</div>
