<div id="page-community" class="page-container">
    <style>
        /* ===== 前面所有样式保持不变 ===== */
        .glass-card { 
            background: rgba(18,22,40,0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 15px; 
            color: #ccd6f0; 
        }
        .title-main { color: #f0b90b; font-size: 18px; font-weight: bold; }
        .desc { color: #a3adc9; font-size: 14px; margin-bottom: 8px; }
        .highlight { color: #4ef0a8; font-weight: 700; }
        .highlight-cyan { color: #4ef0a8; font-weight: 700; }
        .highlight-green { color: #4ecca3; font-weight: 700; }
        .badge {
            background: #cd7f32; color: #000; padding: 2px 12px;
            border-radius: 20px; font-size: 12px; font-weight: 700; margin-left: 8px;
        }
        .badge-gold { background: #f7c744; }
        .badge-silver { background: #b0b8c0; }
        .hint-text { color: #f0b90b; font-size: 12px; margin: 4px 0 8px; }
        .hint-unlock { color: #a3adc9; font-size: 11px; margin: 2px 0 6px; }
        .hint-unlock span { color: #4ef0a8; font-weight: 600; }
        .hint-fund { color: #a3adc9; font-size: 10px; margin: 2px 0 6px; }
        .progress-bar-container {
            width: 100%; height: 20px; background: #1a1f35;
            border-radius: 10px; margin: 8px 0; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 10px; transition: width 0.3s;
            background: linear-gradient(90deg, #4ecca3, #f0b90b);
        }
        .stat-row {
            display: flex; justify-content: space-between;
            font-size: 13px; color: #ccd6f0; margin: 4px 0;
        }
        .stat-value { color: #4ef0a8; font-weight: 700; }
        .price-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; font-size: 13px; color: #a3adc9;
        }
        .price-value { color: #4ef0a8; font-weight: 700; }
        .price-source-tag { font-size: 10px; opacity: 0.7; margin-left: 2px; }
        
        .unlock-card {
            border: 2px solid #f0b90b; border-radius: 20px;
            padding: 16px; margin-bottom: 12px;
            transition: border-color 0.3s, opacity 0.3s;
            background: #0a0d14;
        }
        .unlock-card.locked { border: 2px solid #555; opacity: 0.7; background: #080b10; }
        .unlock-card.unlocked { border: 2px solid #4ecca3; opacity: 1; background: #0a0d14; }
        
        /* ===== 【修复】滚动容器 - 阻止穿透 ===== */
        .vertical-swipe-container {
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            max-height: 55vh;
            padding: 4px;
            /* 阻止滚动穿透 */
            overscroll-behavior: contain;
            -webkit-overscroll-behavior: contain;
            /* 边界回弹效果 */
            overscroll-behavior-y: contain;
        }
        .vertical-swipe-container::-webkit-scrollbar { display: none; }
        .vertical-swipe-track { display: flex; flex-direction: column; gap: 0; }
        .vertical-swipe-card { scroll-snap-align: start; min-height: 100%; padding: 4px 0; }
        
        .swipe-dots-vertical {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; position: fixed; right: 8px; top: 50%;
            transform: translateY(-50%); z-index: 10;
        }
        .swipe-dot-v {
            width: 6px; height: 6px; border-radius: 50%;
            background: #555; transition: all 0.3s;
        }
        .swipe-dot-v.active { background: #f0b90b; height: 16px; border-radius: 3px; }
        
        .btn {
            background: linear-gradient(135deg, #e94560, #b92b4a);
            border: none; color: white; font-weight: 700;
            padding: 14px 18px; border-radius: 18px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 8px 18px rgba(233,69,96,0.3);
            width: 100%; font-size: 14px;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.6; box-shadow: none; transform: none; }
        .btn-gold {
            background: linear-gradient(135deg, #f0b90b, #e8a000);
            box-shadow: 0 8px 18px rgba(240,185,11,0.3);
        }
        .tab-container {
            display: flex; background: #0c0f1c; border-radius: 16px;
            padding: 4px; margin: 12px 0; border: 1px solid #2d3355;
        }
        .tab {
            flex: 1; text-align: center; padding: 10px; border-radius: 14px;
            font-weight: 600; color: #9aa0c0; cursor: pointer; transition: 0.2s;
        }
        .tab.active { background: #e94560; color: white; }
        .input-field {
            background: #0d1020; border: 1px solid #394056;
            border-radius: 16px; padding: 14px 16px; color: white;
            width: 100%; margin: 10px 0 12px; font-size: 15px; outline: none;
        }
        .input-field:focus { border-color: #e94560; }
        .info-box {
            background: #0a0d16; border-radius: 14px; padding: 12px;
            margin-top: 12px; font-size: 14px; border-left: 4px solid #e94560;
            word-break: break-word; color: #ccd6f0;
        }
        .asset-box {
            background: #0f1422; border-radius: 16px;
            padding: 14px; text-align: center; border: 1px solid #2a2f52;
        }
        .asset-label { font-size: 12px; color: #a3adc9; margin-bottom: 4px; }
        .asset-value { font-size: 16px; }
        .live-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            animation: livePulse 1.5s infinite;
        }
        @keyframes livePulse {
            0% { background: #e94560; box-shadow: 0 0 6px #e94560; }
            33% { background: #f0b90b; box-shadow: 0 0 6px #f0b90b; }
            66% { background: #4ecca3; box-shadow: 0 0 6px #4ecca3; }
            100% { background: #e94560; box-shadow: 0 0 6px #e94560; }
        }
        
        /* ===== 【修复】移动端触摸事件穿透阻止 ===== */
        .vertical-swipe-container {
            touch-action: pan-y;
            -webkit-touch-callout: none;
        }
    </style>

    <!-- ========== HTML 内容保持不变 ========== -->
    <!-- 信息卡、激活卡片、权益卡片 -->
</div>
