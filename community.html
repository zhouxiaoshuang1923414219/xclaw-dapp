<div id="page-community" class="page-container">
    <style>
        .community-card { background:rgba(21,22,36,0.9); border-radius:16px; padding:16px; margin-bottom:15px; border:1px solid #23243a; color:#fff; }
        .community-card .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .community-card .header h3 { font-size:18px; font-weight:bold; }
        .community-card .header .link { font-size:13px; color:#888; cursor:pointer; }
        .community-card .sub-text { font-size:13px; color:#aaa; margin-bottom:12px; }
        .invite-input { background:rgba(0,0,0,0.3); border:1px solid #2a2a40; border-radius:12px; padding:10px 16px; margin-bottom:12px; font-size:14px; color:#fff; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:monospace; }
        .action-row { display:flex; gap:12px; }
        .action-btn { flex:1; background:rgba(0,0,0,0.3); border:1px solid #2a2a40; border-radius:12px; padding:10px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; color:#fff; font-size:14px; }
        .action-btn:hover { border-color:#ff3b3b; } .action-btn .icon.red { color:#ff3b3b; }
        .data-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .data-grid .data-item { background:rgba(0,0,0,0.25); border-radius:12px; padding:14px; border:1px solid #2a2a40; }
        .data-grid .data-item .label { font-size:13px; color:#888; margin-bottom:4px; }
        .data-grid .data-item .value { font-size:18px; font-weight:bold; display:flex; align-items:center; gap:4px; }
        .data-grid .data-item .value .num { font-size:20px; } .data-grid .data-item .value .unit { font-size:12px; color:#888; }
    </style>

    <div class="community-card">
        <div class="header"><h3>MYK 生态</h3></div>
        <div class="sub-text">邀请好友，共建MYK生态，赚取推荐奖励</div>
        <div class="invite-input">https://myk.eco/ref/0x...E5Ed</div>
        <div class="action-row">
            <button class="action-btn" onclick="copyLink()"><span class="icon red">📋</span> 复制链接</button>
            <button class="action-btn" onclick="showToast('二维码功能开发中...', 'info')"><span class="icon red">📱</span> 二维码</button>
        </div>
    </div>

    <div class="community-card">
        <div class="header"><h3>生态数据</h3><div class="link">查看节点 ›</div></div>
        <div class="data-grid">
            <div class="data-item"><div class="label">直推人数</div><div class="value"><span class="num">0</span></div></div>
            <div class="data-item"><div class="label">团队人数</div><div class="value"><span class="num">0</span></div></div>
            <div class="data-item"><div class="label">团队认购</div><div class="value"><span class="num">0</span><span class="unit">BNB</span></div></div>
            <div class="data-item"><div class="label">小区认购</div><div class="value"><span class="num">0</span><span class="unit">BNB</span></div></div>
        </div>
    </div>

    <script>
        function copyLink() {
            const link = 'https://myk.eco/ref/0x' + (window.currentAccount ? window.currentAccount.substring(2,8) : '123456');
            if(navigator.clipboard) { navigator.clipboard.writeText(link).then(()=>showToast('链接已复制', 'success')); }
            else { const ta = document.createElement('textarea'); ta.value=link; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('链接已复制', 'success'); }
        }
    </script>
</div>
