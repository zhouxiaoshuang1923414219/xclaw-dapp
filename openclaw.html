<div id="page-ecosystem" class="page-container">
    <style>
        .glass-card { 
            background: rgba(18,22,40,0.7); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 15px; 
            color: #ccd6f0; 
        }
        .title-main { color: #f0b90b; font-size: 18px; font-weight: bold; }
        .desc { color: #a3adc9; font-size: 14px; margin-bottom: 8px; }
        .highlight { color: #4ef0a8; font-weight: 700; }
        .highlight-green { color: #4ecca3; font-weight: 700; }
        .stat-row {
            display: flex; justify-content: space-between;
            font-size: 13px; color: #ccd6f0; margin: 4px 0;
        }
        .stat-value { color: #4ef0a8; font-weight: 700; }
        .progress-bar-container {
            width: 100%; height: 20px; background: #1a1f35;
            border-radius: 10px; margin: 8px 0; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 10px; transition: width 0.3s;
            background: linear-gradient(90deg, #4ecca3, #f0b90b);
        }
        .contract-info-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }
        .asset-box {
            background: #0f1422; border-radius: 16px;
            padding: 14px; text-align: center; border: 1px solid #2a2f52;
        }
        .asset-box-full { grid-column: 1 / -1; }
        .asset-label { font-size: 12px; color: #a3adc9; margin-bottom: 4px; }
        .asset-value { font-size: 16px; }
        .contract-addr-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; margin-bottom: 6px;
            background: rgba(15,20,34,0.6); border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .contract-addr-label {
            font-size: 11px; color: #888; white-space: nowrap; margin-right: 8px;
        }
        .contract-addr-value {
            font-family: 'Fira Code', monospace; font-size: 11px;
            color: #4ef0a8; flex: 1; text-align: center;
            overflow: hidden; text-overflow: ellipsis;
        }
        .contract-addr-copy {
            background: rgba(233,69,96,0.2); border: 1px solid #e94560;
            color: #e94560; padding: 4px 10px; border-radius: 8px;
            cursor: pointer; font-size: 10px; font-weight: 600;
            white-space: nowrap; transition: 0.2s; margin-left: 8px;
        }
        .contract-addr-copy:active { background: #e94560; color: white; }
        .contract-addr-copy.copied { background: #4ecca3; border-color: #4ecca3; color: white; }
    </style>

    <!-- ========== 卡片1：百万MYK生态福利 ========== -->
    <div class="glass-card">
        <h2 style="font-size: 1.2rem; color: #f0b90b; margin-bottom: 12px;">
            🎁 百万MYK生态福利
        </h2>
        <div class="desc">
            新人激活即送 <span class="highlight">2 USDT</span> 等值 MYK，总量 
            <span class="highlight-green" id="airdropTotal">--</span> MYK 赠完即止
        </div>
        <div class="stat-row">
            <span>已赠送：<span class="stat-value" id="airdropPaid">--</span> MYK</span>
            <span>剩余：<span class="stat-value" id="airdropRemaining">--</span> MYK</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="airdropProgress" style="width:0%;"></div>
        </div>
        <div class="stat-row" style="margin-top:4px;">
            <span style="color:#888;">当前奖金池：<span id="airdropPoolBalance">--</span> MYK</span>
            <span style="color:#888;" id="airdropPercent">0%</span>
        </div>
    </div>

    <!-- ========== 卡片2：合约信息 ========== -->
    <div class="glass-card">
        <div class="contract-info-grid">
            <div class="asset-box asset-box-full">
                <div class="asset-label">📊 MYK总发行量 (2100万)</div>
                <div class="stat-value" id="totalSupply" style="font-size:16px;">--</div>
            </div>
            <div class="asset-box">
                <div class="asset-label">🎁 奖金池持币</div>
                <div class="stat-value" id="bonusPool" style="font-size:14px;">--</div>
            </div>
            <div class="asset-box">
                <div class="asset-label">💵 社区治理奖励</div>
                <div class="stat-value" id="govLocked" style="font-size:14px;">--</div>
            </div>
            <div class="asset-box">
                <div class="asset-label">🔥 MYK永久销毁</div>
                <div class="stat-value" id="burnedAmount" style="font-size:14px;">--</div>
            </div>
            <div class="asset-box">
                <div class="asset-label">💰 去中心化基金</div>
                <div class="stat-value" id="fundAsset" style="font-size:14px;">--</div>
            </div>
        </div>

        <div style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.1);">
            <div style="font-size:12px;color:#888;margin-bottom:8px;">📋 合约地址</div>
            <div class="contract-addr-row">
                <span class="contract-addr-label">🔵 MYK</span>
                <span class="contract-addr-value">0xc23CfE...192a</span>
                <button class="contract-addr-copy" data-addr="0xc23CfEeC6D188D627C85106f682D9eb38d94192a">复制</button>
            </div>
            <div class="contract-addr-row">
                <span class="contract-addr-label">🟢 RewardPool</span>
                <span class="contract-addr-value">0x889Cf2...92ec</span>
                <button class="contract-addr-copy" data-addr="0x889Cf28B22790f6f76578013a8812C3012a192ec">复制</button>
            </div>
            <div class="contract-addr-row">
                <span class="contract-addr-label">🟡 Governance</span>
                <span class="contract-addr-value">0x3Ccc54...61C2</span>
                <button class="contract-addr-copy" data-addr="0x3Ccc540a3C5949E0afeB7199bF29aD9daebF61C2">复制</button>
            </div>
            <div class="contract-addr-row">
                <span class="contract-addr-label">🔴 FundManager</span>
                <span class="contract-addr-value">0xD4CB1e...e1b2</span>
                <button class="contract-addr-copy" data-addr="0xD4CB1e8bf1feFA5E93B599E9FE172E0c4651e1b2">复制</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        // ===== 合约地址（已更新） =====
        var MYK = '0xc23CfEeC6D188D627C85106f682D9eb38d94192a';
        var RP = '0x6068890bcDfdBd41b13e5A49e2540Ac5bdf3929B';
        var GOV = '0xE4B0187Aa2EaD11D102eE61Fe2a9AeE23C865e58';
        var FM = '0xe86B0536Db1167dDFD9A95E3Ad522f63B76B0e67';
        var DEAD_ADDR = '0x000000000000000000000000000000000000dEaD';
        var ZERO_ADDR = '0x0000000000000000000000000000000000000000';

        var AIRDROP_INITIAL = 1000000;
        var AIRDROP_STORAGE_KEY = 'myk_airdrop_total_v2_';
        var airdropTotalAmount = 1000000;

        function $(id) { return document.getElementById(id); }
        function n(w) { return parseFloat(Web3.utils.fromWei(w + '', 'ether')); }
        function formatM(v) {
            if (v >= 1000000) return (v / 1000000).toFixed(2) + 'M';
            if (v >= 1000) return (v / 1000).toFixed(2) + 'K';
            return v.toFixed(2);
        }

        function encodeCall(sig, types, values) {
            var s = web3.eth.abi.encodeFunctionSignature(sig);
            if (!types || !types.length) return s;
            var e = web3.eth.abi.encodeParameters(types, values);
            return s + e.slice(2);
        }

        // ===== 获取空投数据 =====
        async function fetchAirdrop() {
            if (!web3) return;
            try {
                var data = encodeCall('getActivityPoolBalance()');
                var result = await web3.eth.call({ to: RP, data: data });
                var currentBalance = n(web3.eth.abi.decodeParameter('uint256', result));

                var storageKey = AIRDROP_STORAGE_KEY + RP;
                var stored = localStorage.getItem(storageKey);

                if (!stored) {
                    airdropTotalAmount = Math.max(currentBalance, AIRDROP_INITIAL);
                    localStorage.setItem(storageKey, airdropTotalAmount);
                } else {
                    airdropTotalAmount = parseFloat(stored);
                    if (currentBalance > airdropTotalAmount) {
                        airdropTotalAmount = currentBalance;
                        localStorage.setItem(storageKey, airdropTotalAmount);
                    }
                }

                var paid = airdropTotalAmount - currentBalance;
                var percent = Math.min(100, Math.max(0, (paid / airdropTotalAmount) * 100));

                $('airdropTotal').textContent = formatM(airdropTotalAmount);
                $('airdropPaid').textContent = formatM(paid);
                $('airdropRemaining').textContent = formatM(currentBalance);
                $('airdropProgress').style.width = percent.toFixed(1) + '%';
                $('airdropPercent').textContent = percent.toFixed(1) + '%';
                $('airdropPoolBalance').textContent = formatM(currentBalance);
            } catch (e) {
                $('airdropTotal').textContent = '--';
                $('airdropPaid').textContent = '--';
                $('airdropRemaining').textContent = '--';
                $('airdropPercent').textContent = '0%';
                $('airdropPoolBalance').textContent = '--';
            }
        }

        // ===== 获取合约信息 =====
        async function fetchContractInfo() {
            if (!web3) return;
            try {
                var tsResult = await web3.eth.call({ to: MYK, data: encodeCall('totalSupply()') });
                $('totalSupply').textContent = formatM(n(web3.eth.abi.decodeParameter('uint256', tsResult)));

                var burnedTotal = 0;
                try {
                    var deadResult = await web3.eth.call({ to: MYK, data: encodeCall('balanceOf(address)', ['address'], [DEAD_ADDR]) });
                    burnedTotal += n(web3.eth.abi.decodeParameter('uint256', deadResult));
                } catch (e) {}
                try {
                    var zeroResult = await web3.eth.call({ to: MYK, data: encodeCall('balanceOf(address)', ['address'], [ZERO_ADDR]) });
                    burnedTotal += n(web3.eth.abi.decodeParameter('uint256', zeroResult));
                } catch (e) {}
                $('burnedAmount').textContent = formatM(burnedTotal);

                try {
                    var bpResult = await web3.eth.call({ to: MYK, data: encodeCall('balanceOf(address)', ['address'], [RP]) });
                    $('bonusPool').textContent = formatM(n(web3.eth.abi.decodeParameter('uint256', bpResult)));
                } catch (e) { $('bonusPool').textContent = '--'; }

                try {
                    var divData = encodeCall('getDividendInfo()');
                    var divResult = await web3.eth.call({ to: GOV, data: divData });
                    var info = web3.eth.abi.decodeParameters(['uint256','uint256','uint256','uint256'], divResult);
                    var totalDividend = BigInt(info[0]) + BigInt(info[1]) + BigInt(info[2]);
                    $('govLocked').textContent = formatM(n(totalDividend.toString()));
                } catch (e) {
                    try {
                        var gbResult = await web3.eth.call({ to: MYK, data: encodeCall('balanceOf(address)', ['address'], [GOV]) });
                        $('govLocked').textContent = formatM(n(web3.eth.abi.decodeParameter('uint256', gbResult)));
                    } catch (e2) { $('govLocked').textContent = '--'; }
                }

                try {
                    var fbResult = await web3.eth.call({ to: MYK, data: encodeCall('balanceOf(address)', ['address'], [FM]) });
                    $('fundAsset').textContent = formatM(n(web3.eth.abi.decodeParameter('uint256', fbResult)));
                } catch (e) { $('fundAsset').textContent = '--'; }
            } catch (e) {
                $('totalSupply').textContent = '--';
                $('burnedAmount').textContent = '--';
            }
        }

        // ===== 复制按钮 =====
        function setupCopyButtons() {
            document.querySelectorAll('.contract-addr-copy').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    var addr = this.dataset.addr;
                    if (!addr) return;
                    try {
                        await navigator.clipboard.writeText(addr);
                        this.textContent = '✅已复制';
                        this.classList.add('copied');
                        setTimeout(function(self) { self.textContent = '复制'; self.classList.remove('copied'); }, 2000, this);
                    } catch (e) {
                        var ta = document.createElement('textarea');
                        ta.value = addr;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        this.textContent = '✅已复制';
                        this.classList.add('copied');
                        setTimeout(function(self) { self.textContent = '复制'; self.classList.remove('copied'); }, 2000, this);
                    }
                });
            });
        }

        // ===== 初始化 =====
        function init() {
            setupCopyButtons();
            if (typeof web3 !== 'undefined' && web3) {
                fetchAirdrop();
                fetchContractInfo();
                setInterval(function() { fetchAirdrop(); fetchContractInfo(); }, 60000);
            } else {
                var checkWeb3 = setInterval(function() {
                    if (typeof web3 !== 'undefined' && web3) {
                        clearInterval(checkWeb3);
                        fetchAirdrop();
                        fetchContractInfo();
                        setInterval(function() { fetchAirdrop(); fetchContractInfo(); }, 60000);
                    }
                }, 500);
            }
            document.addEventListener('walletConnected', function() { fetchAirdrop(); fetchContractInfo(); });
        }

        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
        else { init(); }
    })();
    </script>
</div>
